<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160" role="img" aria-labelledby="title desc">
  <title id="title">DataLeakDetector 纯日志挖掘内存架构</title>
  <desc id="desc">展示原始日志经过规范化、候选筛选、紧凑事件视图、四类内存索引、窗口判级和后处理，最终输出 AnalysisWindow 的流程，并标明下游抽帧、事件关联和 Datalog 推理边界。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #ffffff; }
      .subtitle { font: 400 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #cbd5e1; }
      .section { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .box-title { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .body { font: 400 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #334155; }
      .small { font: 400 12px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #475569; }
      .code { font: 600 12px Consolas, "Microsoft YaHei", monospace; fill: #1e293b; }
      .white { fill: #ffffff; }
      .muted-white { fill: #e2e8f0; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .dash-arrow { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="1160" fill="#f8fafc"/>
  <rect x="0" y="0" width="1440" height="92" fill="#14213d"/>
  <text x="54" y="43" class="title">DataLeakDetector：纯日志挖掘内存架构</text>
  <text x="54" y="70" class="subtitle">不使用 Neo4j · 单 case 内排序、二分索引、区间合并与确定性规则 · 输出 AnalysisWindow，不直接判定泄漏</text>

  <rect x="1040" y="116" width="346" height="224" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="1040" y="116" width="346" height="44" rx="6" fill="#be123c"/>
  <path d="M1040 154 H1386 V160 H1040 Z" fill="#be123c"/>
  <text x="1062" y="144" class="box-title white">本阶段的边界</text>
  <circle cx="1068" cy="187" r="4" fill="#be123c"/>
  <text x="1082" y="192" class="body">不连接、不导入、不查询图数据库</text>
  <circle cx="1068" cy="220" r="4" fill="#be123c"/>
  <text x="1082" y="225" class="body">不读取视频像素，不调用 VLM</text>
  <circle cx="1068" cy="253" r="4" fill="#be123c"/>
  <text x="1082" y="258" class="body">不使用 groundtruth 扩充敏感源</text>
  <circle cx="1068" cy="286" r="4" fill="#be123c"/>
  <text x="1082" y="291" class="body">不直接输出 confirmed leak</text>
  <text x="1062" y="320" class="small">职责：把海量日志压缩成少量“值得看”的时间窗</text>

  <text x="54" y="130" class="section">A. 入口与输入</text>
  <rect x="54" y="150" width="286" height="118" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="76" y="180" class="box-title">原始 case 输入</text>
  <text x="76" y="205" class="code">records: list[dict]</text>
  <text x="76" y="227" class="code">sensitive_files: list[str]</text>
  <text x="76" y="249" class="code">recording_start_ms</text>

  <path d="M340 209 H386" class="arrow"/>

  <rect x="388" y="150" width="286" height="118" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="180" class="box-title">日志规范化</text>
  <text x="410" y="205" class="code">list[LogEvent]</text>
  <text x="410" y="227" class="body">统一路径、事件字段和绝对时间</text>
  <text x="410" y="249" class="body">映射 video_time_ms；无效时间为 -1</text>

  <path d="M674 209 H720" class="arrow"/>

  <rect x="722" y="150" width="286" height="118" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="744" y="180" class="box-title">InMemoryLogMiner</text>
  <text x="744" y="205" class="code">build_analysis_windows(...)</text>
  <text x="744" y="227" class="body">source = "in_memory"</text>
  <text x="744" y="249" class="body">Neo4j 失败回退时为 in_memory_fallback</text>

  <path d="M865 268 V300 H706 V370" class="arrow"/>

  <text x="54" y="322" class="section">B. 单次扫描：先降噪，再建索引</text>
  <rect x="54" y="344" width="390" height="122" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="76" y="374" class="box-title">1  候选事件筛选</text>
  <text x="76" y="399" class="code">candidate_events: list[LogEvent]</text>
  <text x="76" y="423" class="body">保留敏感命中、上传/发送、剪贴板、截图、</text>
  <text x="76" y="445" class="body">派生操作、sink app；提前丢弃系统噪声和负时间</text>

  <path d="M444 405 H486" class="arrow"/>

  <rect x="488" y="344" width="468" height="122" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="510" y="374" class="box-title">2  紧凑事件视图</text>
  <text x="510" y="399" class="code">event_view = candidates ∪ foreground transitions</text>
  <text x="510" y="423" class="body">原始日志仍负责发现候选；后续上下文查询只扫描</text>
  <text x="510" y="445" class="body">候选与前台切换，避免反复展开无关文件系统元数据</text>

  <path d="M722 466 V506" class="arrow"/>

  <text x="54" y="506" class="section">C. 四类只读内存索引</text>
  <rect x="54" y="530" width="316" height="154" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="76" y="560" class="box-title">_LogTimeIndex</text>
  <text x="76" y="585" class="code">times: tuple[int, ...]</text>
  <text x="76" y="607" class="code">events: tuple[LogEvent, ...]</text>
  <text x="76" y="635" class="body">bisect 查附近 ±4s 的日志上下文</text>
  <text x="76" y="657" class="small">查询：O(log n + k)</text>

  <rect x="390" y="530" width="316" height="154" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"/>
  <text x="412" y="560" class="box-title">_SensitiveContextIndex</text>
  <text x="412" y="585" class="code">interval_starts / interval_ends</text>
  <text x="412" y="607" class="code">signal_times: tuple[int, ...]</text>
  <text x="412" y="635" class="body">判断文件仍打开，或 30s 内有敏感信号</text>
  <text x="412" y="657" class="small">有序区间 + 二分，不做全表回扫</text>

  <rect x="726" y="530" width="316" height="154" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/>
  <text x="748" y="560" class="box-title">_ActiveAppIndex</text>
  <text x="748" y="585" class="code">times: tuple[int, ...]</text>
  <text x="748" y="607" class="code">apps: tuple[str, ...]</text>
  <text x="748" y="635" class="body">定位窗口内非白名单前台应用</text>
  <text x="748" y="657" class="small">bisect 切片 + set 保序去重</text>

  <rect x="1062" y="530" width="324" height="154" rx="6" fill="#fdf2f8" stroke="#be185d" stroke-width="1.8"/>
  <text x="1084" y="560" class="box-title">_ForegroundRangeIndex</text>
  <text x="1084" y="585" class="code">ranges: tuple[(start, end), ...]</text>
  <text x="1084" y="615" class="body">把前台切换转成可见活动区间</text>
  <text x="1084" y="637" class="body">输出与 AnalysisWindow 相交的部分</text>
  <text x="1084" y="659" class="small">供抽帧阶段优先保留真实活动画面</text>

  <path d="M212 684 V704 H522" fill="none" stroke="#64748b" stroke-width="1.7"/>
  <path d="M548 684 V704 H522" fill="none" stroke="#64748b" stroke-width="1.7"/>
  <path d="M884 684 V704 H522" fill="none" stroke="#64748b" stroke-width="1.7"/>
  <path d="M1224 684 V704 H522" fill="none" stroke="#64748b" stroke-width="1.7"/>
  <circle cx="522" cy="704" r="4" fill="#475569"/>
  <path d="M522 704 V752" class="arrow"/>

  <text x="54" y="730" class="section">D. 逐候选判级并生成窗口</text>
  <rect x="54" y="754" width="550" height="158" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <text x="76" y="784" class="box-title">信号计算</text>
  <text x="76" y="810" class="code">sensitive_hit · open_context_hit · recent_signal_hit</text>
  <text x="76" y="834" class="code">transfer_hit · sink_hit · sensitive_context_hit</text>
  <text x="76" y="862" class="body">文件名/路径、事件文本、结构化 upload_detection、</text>
  <text x="76" y="884" class="body">前台应用、打开区间和附近事件共同提供上下文</text>

  <path d="M604 833 H644" class="arrow"/>

  <rect x="646" y="754" width="364" height="158" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/>
  <text x="668" y="784" class="box-title">_window_priority</text>
  <rect x="668" y="803" width="76" height="27" rx="5" fill="#fee2e2"/>
  <text x="684" y="822" class="code">strong</text>
  <text x="760" y="822" class="small">明确上传、发送、派生或移动介质</text>
  <rect x="668" y="838" width="76" height="27" rx="5" fill="#dbeafe"/>
  <text x="680" y="857" class="code">medium</text>
  <text x="760" y="857" class="small">敏感活动或较弱 sink 上下文</text>
  <rect x="668" y="873" width="76" height="27" rx="5" fill="#f1f5f9"/>
  <text x="688" y="892" class="code">weak</text>
  <text x="760" y="892" class="small">仅高风险标签，默认不输出</text>

  <path d="M1010 833 H1050" class="arrow"/>

  <rect x="1052" y="754" width="334" height="158" rx="6" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"/>
  <text x="1074" y="784" class="box-title">AnalysisWindow（初始）</text>
  <text x="1074" y="809" class="code">start_ms / end_ms / priority</text>
  <text x="1074" y="831" class="code">step_ms / max_keyframes</text>
  <text x="1074" y="853" class="code">anchor_ms / action_anchor_ms</text>
  <text x="1074" y="875" class="code">reason / diff_threshold</text>
  <text x="1074" y="897" class="small">此时仍未读取任何视频像素</text>

  <path d="M1219 912 V942 H950" class="arrow"/>

  <text x="54" y="948" class="section">E. 窗口后处理与输出</text>
  <rect x="54" y="970" width="936" height="112" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="76" y="1000" class="box-title">按固定顺序执行</text>
  <text x="76" y="1027" class="code">分段/同优先级合并 → 过滤无 anchor medium → sink follow-up anchors → anchor 稀疏化</text>
  <text x="76" y="1051" class="code">→ 回填 active_apps + active_ranges → LogMiningResult(windows, source, metadata)</text>
  <text x="76" y="1073" class="small">核心集合操作：dict 分组、set 去重、有序区间合并；结果按 priority 和时间稳定排序</text>

  <path d="M990 1026 H1036" class="dash-arrow"/>

  <rect x="1038" y="950" width="348" height="152" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="1060" y="980" class="box-title">下游：不属于日志挖掘</text>
  <text x="1060" y="1008" class="body">1. AnalysisWindow → 非均匀关键帧</text>
  <text x="1060" y="1032" class="body">2. 关键帧 → VLM → FrameObservation</text>
  <text x="1060" y="1056" class="body">3. 日志 + 视觉 → 文件血缘/关联事件</text>
  <text x="1060" y="1080" class="body">4. Datalog facts → deque BFS → LeakPath</text>

  <line x1="54" y1="1127" x2="1386" y2="1127" stroke="#cbd5e1"/>
  <text x="54" y="1148" class="small">复杂度：建索引通常 O(n log n)，内存 O(n)；区间查询 O(log n + k)。优势是零外部服务、确定性强；限制是没有跨 case 持久化与任意图查询。</text>
</svg>
