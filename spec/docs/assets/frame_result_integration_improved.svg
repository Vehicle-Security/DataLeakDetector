<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">抽帧结果整合图</title>
  <desc id="desc">展示 Bluetooth-SensitiveLeak 中 raw_all、duplicates、raw、OCR 和 VLM 候选的数量关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.4; rx: 8; }
      .raw { fill: #eef6ff; stroke: #2563eb; }
      .drop { fill: #fff1f2; stroke: #e11d48; }
      .ok { fill: #f0fdf4; stroke: #16a34a; }
      .vlm { fill: #fffbeb; stroke: #d97706; }
      .title { font-size: 17px; font-weight: 700; }
      .num { font-size: 28px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 12px; fill: #475569; }
      .line { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .split { stroke: #94a3b8; stroke-width: 1.3; stroke-dasharray: 6 6; fill: none; }
    </style>
  </defs>

  <rect x="24" y="24" width="1072" height="472" fill="#ffffff" stroke="#cbd5e1" rx="12"/>
  <text x="52" y="58" class="title">Bluetooth-SensitiveLeak：抽帧结果怎样整合</text>
  <text x="52" y="80" class="small">不要只看图片数量，要看每一步怎么把候选变成证据输入。</text>

  <rect x="62" y="134" width="170" height="112" class="raw"/>
  <text x="86" y="164" class="title">keyframes_raw_all</text>
  <text x="116" y="204" class="num">31</text>
  <text x="86" y="228" class="body">窗口与 anchor 候选全集</text>

  <rect x="316" y="78" width="172" height="112" class="drop"/>
  <text x="342" y="108" class="title">duplicates</text>
  <text x="374" y="148" class="num">13</text>
  <text x="342" y="172" class="body">近重复 anchor / 同画面</text>

  <rect x="316" y="250" width="172" height="112" class="ok"/>
  <text x="342" y="280" class="title">keyframes_raw</text>
  <text x="374" y="320" class="num">18</text>
  <text x="342" y="344" class="body">最终关键帧</text>

  <rect x="572" y="250" width="172" height="112" class="ok"/>
  <text x="604" y="280" class="title">ocr_results</text>
  <text x="630" y="320" class="num">18</text>
  <text x="604" y="344" class="body">paddleocr_gpu</text>

  <rect x="828" y="250" width="190" height="112" class="vlm"/>
  <text x="850" y="280" class="title">VLM candidates</text>
  <text x="894" y="320" class="num">8</text>
  <text x="850" y="344" class="body">ocr 模式下只导出备查</text>

  <path class="line" d="M232 190 C270 190 276 134 316 134"/>
  <path class="line" d="M232 190 C270 190 276 306 316 306"/>
  <path class="line" d="M488 306 H572"/>
  <path class="line" d="M744 306 H828"/>

  <path class="split" d="M260 132 C286 110 294 104 316 104"/>
  <path class="split" d="M260 224 C286 260 294 276 316 276"/>

  <rect x="92" y="404" width="900" height="56" class="box"/>
  <text x="116" y="430" class="body">读法：raw_all 允许重复，用来复盘候选；raw 是去重后的实际 OCR 输入；duplicates 解释删除原因；VLM candidates 是从 OCR 结果里再挑出的少量语义补全帧。</text>
</svg>
