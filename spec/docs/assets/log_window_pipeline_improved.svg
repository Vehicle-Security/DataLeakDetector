<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">改进后窗口合并与过滤</title>
  <desc id="desc">展示 strong、medium、weak 窗口的分段合并、无 anchor medium 过滤和输出到抽帧器的过程。</desc>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .axis { stroke: #334155; stroke-width: 2; }
      .tick { stroke: #64748b; stroke-width: 1; }
      .strong { fill: #fb7185; stroke: #be123c; stroke-width: 1.5; rx: 5; }
      .medium { fill: #93c5fd; stroke: #1d4ed8; stroke-width: 1.5; rx: 5; }
      .kept { fill: #86efac; stroke: #15803d; stroke-width: 1.5; rx: 5; }
      .drop { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1.5; rx: 5; }
      .box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.3; rx: 8; }
      .title { font-size: 17px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 12px; fill: #475569; }
      .line { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow2); }
      .segment { fill: none; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 6 6; }
    </style>
  </defs>

  <rect x="24" y="24" width="1072" height="452" fill="#ffffff" stroke="#cbd5e1" rx="12"/>
  <text x="52" y="58" class="title">窗口合并与过滤细节</text>
  <text x="52" y="80" class="small">medium 先按 case segment 分段，再段内合并；默认只保留 strong 和带 anchor 的 medium。</text>

  <line x1="80" y1="142" x2="1040" y2="142" class="axis"/>
  <line x1="80" y1="132" x2="80" y2="152" class="tick"/>
  <line x1="400" y1="132" x2="400" y2="152" class="tick"/>
  <line x1="720" y1="132" x2="720" y2="152" class="tick"/>
  <line x1="1040" y1="132" x2="1040" y2="152" class="tick"/>
  <text x="72" y="122" class="small">0s</text>
  <text x="370" y="122" class="small">5min</text>
  <text x="690" y="122" class="small">10min</text>
  <text x="1000" y="122" class="small">15min</text>
  <rect x="80" y="104" width="320" height="104" class="segment"/>
  <rect x="400" y="104" width="320" height="104" class="segment"/>
  <rect x="720" y="104" width="320" height="104" class="segment"/>

  <text x="52" y="178" class="body">原始窗口</text>
  <rect x="110" y="164" width="132" height="26" class="medium"/>
  <text x="126" y="183" class="small">medium + anchor</text>
  <rect x="256" y="164" width="110" height="26" class="medium"/>
  <text x="272" y="183" class="small">medium</text>
  <rect x="452" y="164" width="84" height="26" class="strong"/>
  <text x="470" y="183" class="small">strong</text>
  <rect x="574" y="164" width="116" height="26" class="medium"/>
  <text x="590" y="183" class="small">medium</text>
  <rect x="798" y="164" width="90" height="26" class="strong"/>
  <text x="816" y="183" class="small">strong</text>

  <path class="line" d="M560 210 V250"/>

  <text x="52" y="278" class="body">段内合并</text>
  <rect x="110" y="264" width="256" height="28" class="medium"/>
  <text x="160" y="284" class="small">segment 0 merged medium</text>
  <rect x="452" y="264" width="84" height="28" class="strong"/>
  <rect x="574" y="264" width="116" height="28" class="medium"/>
  <rect x="798" y="264" width="90" height="28" class="strong"/>

  <path class="line" d="M560 306 V348"/>

  <text x="52" y="376" class="body">过滤后输出</text>
  <rect x="110" y="362" width="256" height="30" class="kept"/>
  <text x="152" y="383" class="small">保留：带 anchor medium</text>
  <rect x="452" y="362" width="84" height="30" class="kept"/>
  <text x="466" y="383" class="small">strong</text>
  <rect x="574" y="362" width="116" height="30" class="drop"/>
  <text x="590" y="383" class="small">丢弃：无 anchor</text>
  <rect x="798" y="362" width="90" height="30" class="kept"/>
  <text x="816" y="383" class="small">strong</text>

  <rect x="868" y="414" width="174" height="42" class="box"/>
  <text x="888" y="440" class="body">输出 AnalysisWindow</text>
  <path class="line" d="M843 392 C850 420 862 430 868 434"/>
</svg>
