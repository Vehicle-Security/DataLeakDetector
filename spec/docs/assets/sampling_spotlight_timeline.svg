<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">日志窗口拉出探照区域示意图</title>
  <desc id="desc">长视频不会均匀抽帧，日志窗口在可疑时间段形成 medium 和 strong 探照区域，抽帧器只在这些区域里生成候选点并保留关键帧。</desc>
  <defs>
    <linearGradient id="mediumBeam" x1="0" x2="1">
      <stop offset="0%" stop-color="#d8e8ff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#7fb0f0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#d8e8ff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="strongBeam" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffe1df" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#ee7568" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffe1df" stop-opacity="0.1"/>
    </linearGradient>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #17212b; }
      .subtitle { font: 400 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #53606d; }
      .label { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2a34; }
      .small { font: 400 12px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #5f6b76; }
      .timeline { stroke: #2c3a45; stroke-width: 4; stroke-linecap: round; }
      .tick { stroke: #2c3a45; stroke-width: 2; }
      .candidate { fill: #ffffff; stroke: #9aa6b2; stroke-width: 1.2; }
      .kept-medium { fill: #4b82cf; stroke: #1f5ea8; stroke-width: 1; }
      .kept-strong { fill: #d7564a; stroke: #a33f36; stroke-width: 1; }
      .event { fill: #ffffff; stroke: #cfd7e2; stroke-width: 1.3; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="520" />
  <text x="50" y="58" class="title">日志窗口像探照灯：只照亮值得回看的时间段</text>
  <text x="50" y="84" class="subtitle">候选点可以密集出现，但最终只有视觉变化明显、靠近锚点且非重复的画面会留下。</text>

  <line x1="90" y1="240" x2="1190" y2="240" class="timeline" />
  <text x="90" y="214" class="label">视频时间轴</text>
  <text x="82" y="270" class="small">0s</text>
  <text x="300" y="270" class="small">30s</text>
  <text x="520" y="270" class="small">60s</text>
  <text x="740" y="270" class="small">90s</text>
  <text x="960" y="270" class="small">120s</text>
  <text x="1174" y="270" class="small">150s</text>

  <line x1="90" y1="228" x2="90" y2="254" class="tick" />
  <line x1="310" y1="228" x2="310" y2="254" class="tick" />
  <line x1="530" y1="228" x2="530" y2="254" class="tick" />
  <line x1="750" y1="228" x2="750" y2="254" class="tick" />
  <line x1="970" y1="228" x2="970" y2="254" class="tick" />
  <line x1="1190" y1="228" x2="1190" y2="254" class="tick" />

  <path d="M250 226 C310 98 558 98 620 226 Z" fill="url(#mediumBeam)" stroke="#4b82cf" stroke-width="1.6" />
  <text x="336" y="128" class="label">medium 探照区</text>
  <text x="316" y="152" class="small">长上下文，候选点较疏</text>

  <path d="M596 226 C632 88 742 88 780 226 Z" fill="url(#strongBeam)" stroke="#d7564a" stroke-width="1.8" />
  <text x="622" y="116" class="label">strong 探照区</text>
  <text x="612" y="140" class="small">短窗口，高频候选点</text>

  <path d="M836 226 C872 100 982 100 1020 226 Z" fill="url(#strongBeam)" stroke="#d7564a" stroke-width="1.8" />
  <text x="866" y="128" class="label">strong 探照区</text>
  <text x="856" y="152" class="small">上传/传输完成附近</text>

  <rect x="270" y="302" width="150" height="46" rx="9" class="event" />
  <text x="286" y="322" class="small">app_switch</text>
  <text x="286" y="340" class="small">生成 medium 窗口</text>
  <rect x="610" y="302" width="168" height="46" rx="9" class="event" />
  <text x="626" y="322" class="small">file_selected</text>
  <text x="626" y="340" class="small">生成 strong 窗口</text>
  <rect x="850" y="302" width="184" height="46" rx="9" class="event" />
  <text x="866" y="322" class="small">upload_complete</text>
  <text x="866" y="340" class="small">生成 strong 窗口</text>

  <g>
    <circle cx="286" cy="240" r="4" class="candidate" />
    <circle cx="324" cy="240" r="4" class="candidate" />
    <circle cx="362" cy="240" r="6" class="kept-medium" />
    <circle cx="400" cy="240" r="4" class="candidate" />
    <circle cx="438" cy="240" r="6" class="kept-medium" />
    <circle cx="476" cy="240" r="4" class="candidate" />
    <circle cx="514" cy="240" r="4" class="candidate" />
    <circle cx="552" cy="240" r="6" class="kept-medium" />
  </g>
  <g>
    <circle cx="620" cy="240" r="4" class="candidate" />
    <circle cx="640" cy="240" r="6" class="kept-strong" />
    <circle cx="660" cy="240" r="4" class="candidate" />
    <circle cx="680" cy="240" r="6" class="kept-strong" />
    <circle cx="700" cy="240" r="6" class="kept-strong" />
    <circle cx="720" cy="240" r="4" class="candidate" />
    <circle cx="740" cy="240" r="6" class="kept-strong" />
  </g>
  <g>
    <circle cx="860" cy="240" r="4" class="candidate" />
    <circle cx="884" cy="240" r="6" class="kept-strong" />
    <circle cx="908" cy="240" r="4" class="candidate" />
    <circle cx="932" cy="240" r="6" class="kept-strong" />
    <circle cx="956" cy="240" r="4" class="candidate" />
    <circle cx="980" cy="240" r="6" class="kept-strong" />
  </g>

  <text x="92" y="420" class="small">空心点：候选点；蓝色实心点：medium 最终关键帧；红色实心点：strong 最终关键帧。</text>
  <text x="92" y="446" class="small">未被日志窗口照亮的长时间段不会进入 OCR/VLM，从源头控制成本。</text>
</svg>
