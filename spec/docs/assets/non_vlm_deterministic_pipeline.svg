<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">非 VLM 确定性推理流程</title>
  <desc id="desc">展示日志和 OCR 如何通过归一化、字段抽取、时间和文件 join、外发通道分类、Datalog facts 与 taint 传播得到泄露结论。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.4; rx: 8; }
      .log { fill: #eef6ff; stroke: #2563eb; }
      .ocr { fill: #f0fdf4; stroke: #16a34a; }
      .join { fill: #fffbeb; stroke: #d97706; }
      .fact { fill: #fff1f2; stroke: #e11d48; }
      .out { fill: #f5f3ff; stroke: #7c3aed; }
      .title { font-size: 17px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 12px; fill: #475569; }
      .line { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.3; fill: none; stroke-dasharray: 5 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="24" y="24" width="1132" height="512" fill="#ffffff" stroke="#cbd5e1" rx="12"/>
  <text x="52" y="58" class="title">非 VLM：把杂数据压成事实，再用规则推理</text>
  <text x="52" y="80" class="small">全程不让模型解释语义；只做时间、文件、动作、sink、lineage 和 taint 的确定性 join。</text>

  <rect x="58" y="126" width="150" height="82" class="log"/>
  <text x="80" y="156" class="title">原始日志</text>
  <text x="80" y="182" class="body">event_type</text>
  <text x="80" y="202" class="body">file_path / process</text>

  <rect x="58" y="294" width="150" height="82" class="ocr"/>
  <text x="80" y="324" class="title">OCR 文本</text>
  <text x="80" y="350" class="body">timestamp</text>
  <text x="80" y="370" class="body">text / confidence</text>

  <rect x="260" y="126" width="156" height="82" class="box"/>
  <text x="282" y="156" class="title">日志归一化</text>
  <text x="282" y="182" class="body">video_time_ms</text>
  <text x="282" y="202" class="body">normalize_path</text>

  <rect x="260" y="294" width="156" height="82" class="box"/>
  <text x="282" y="324" class="title">OCR 抽事实</text>
  <text x="282" y="350" class="body">mentioned_files</text>
  <text x="282" y="370" class="body">sink/action words</text>

  <rect x="468" y="98" width="178" height="110" class="join"/>
  <text x="490" y="128" class="title">时间 join</text>
  <text x="490" y="154" class="body">abs(log_time - ocr_time)</text>
  <text x="490" y="174" class="body">&lt;= tolerance</text>
  <text x="490" y="194" class="small">例：19517ms == 19517ms</text>

  <rect x="468" y="260" width="178" height="116" class="join"/>
  <text x="490" y="290" class="title">同文件 join</text>
  <text x="490" y="316" class="body">basename / stem</text>
  <text x="490" y="336" class="body">same_file</text>
  <text x="490" y="358" class="small">公司合作合同.docx</text>

  <rect x="700" y="126" width="176" height="92" class="join"/>
  <text x="722" y="156" class="title">动作 + sink 分类</text>
  <text x="722" y="182" class="body">file_selected/upload</text>
  <text x="722" y="202" class="body">gpt / 蓝牙 / 发送</text>

  <rect x="700" y="286" width="176" height="92" class="fact"/>
  <text x="722" y="316" class="title">CorrelatedEvent</text>
  <text x="722" y="342" class="body">original/current file</text>
  <text x="722" y="362" class="body">evidence_refs</text>

  <rect x="928" y="126" width="174" height="92" class="fact"/>
  <text x="950" y="156" class="title">Datalog facts</text>
  <text x="950" y="182" class="body">OpenFile</text>
  <text x="950" y="202" class="body">Transfer / LeakFile</text>

  <rect x="928" y="286" width="174" height="92" class="out"/>
  <text x="950" y="316" class="title">Taint 推理</text>
  <text x="950" y="342" class="body">Sensitive -> Derived</text>
  <text x="950" y="362" class="body">-> Sink -> LeakPath</text>

  <rect x="468" y="430" width="408" height="58" class="box"/>
  <text x="490" y="456" class="body">Lineage 旁路：save_as / print_to_pdf / screenshot / base64 把敏感性传给派生文件</text>

  <path class="line" d="M208 167 H260"/>
  <path class="line" d="M208 335 H260"/>
  <path class="line" d="M416 167 H468"/>
  <path class="line" d="M416 335 H468"/>
  <path class="line" d="M646 153 H700"/>
  <path class="line" d="M646 318 H700"/>
  <path class="line" d="M788 218 V286"/>
  <path class="line" d="M876 172 H928"/>
  <path class="line" d="M876 332 H928"/>
  <path class="line" d="M1015 218 V286"/>
  <path class="dash" d="M672 430 V378"/>
</svg>
