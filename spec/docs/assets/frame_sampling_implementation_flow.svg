<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" role="img" aria-labelledby="title desc">
  <title id="title">抽帧具体实现流程</title>
  <desc id="desc">展示 AnalysisWindow 进入视觉流水线后，如何生成 probe、顺序解码、按窗口保留帧、全局去重、裁剪 OCR 输入并导出 artifact。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.4; rx: 8; }
      .entry { fill: #eef6ff; stroke: #2563eb; }
      .video { fill: #f0fdf4; stroke: #16a34a; }
      .select { fill: #fffbeb; stroke: #d97706; }
      .dedupe { fill: #fff7ed; stroke: #ea580c; }
      .ocr { fill: #f5f3ff; stroke: #7c3aed; }
      .out { fill: #fdf2f8; stroke: #db2777; }
      .title { font-size: 17px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 12px; fill: #475569; }
      .line { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.3; stroke-dasharray: 5 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="24" y="24" width="1132" height="632" fill="#ffffff" stroke="#cbd5e1" rx="12"/>
  <text x="52" y="58" class="title">抽帧具体实现：从日志窗口到 OCR/VLM 输入</text>
  <text x="52" y="82" class="small">抽帧只处理视频窗口和像素；日志语义已在 AnalysisWindow 中给出，anchor 优先，重复帧可追踪。</text>

  <rect x="58" y="124" width="208" height="96" class="entry"/>
  <text x="80" y="154" class="title">视觉入口</text>
  <text x="80" y="180" class="body">analyze_video_behavior</text>
  <text x="80" y="200" class="body">_run_vision_pipeline</text>

  <rect x="326" y="124" width="220" height="96" class="entry"/>
  <text x="348" y="154" class="title">窗口输入</text>
  <text x="348" y="180" class="body">AnalysisWindow 列表</text>
  <text x="348" y="200" class="body">start/end/anchor/priority</text>

  <rect x="606" y="124" width="230" height="96" class="video"/>
  <text x="628" y="154" class="title">生成 probe</text>
  <text x="628" y="180" class="body">_probe_timestamps</text>
  <text x="628" y="200" class="body">anchor + 起止点 + 下采样</text>

  <rect x="896" y="124" width="214" height="96" class="video"/>
  <text x="918" y="154" class="title">读视频帧</text>
  <text x="918" y="180" class="body">_read_frames_for_timestamps</text>
  <text x="918" y="200" class="body">5s 内分组顺序解码</text>

  <rect x="148" y="298" width="250" height="108" class="select"/>
  <text x="170" y="328" class="title">窗口内保留</text>
  <text x="170" y="354" class="body">160x90 灰度缩略图</text>
  <text x="170" y="374" class="body">diff score + average hash</text>
  <text x="170" y="394" class="body">anchor / duplicate / threshold</text>

  <rect x="468" y="298" width="244" height="108" class="dedupe"/>
  <text x="490" y="328" class="title">全局去重</text>
  <text x="490" y="354" class="body">_dedupe_keyframes_globally</text>
  <text x="490" y="374" class="body">strong -> medium -> weak</text>
  <text x="490" y="394" class="body">duplicates 可追踪</text>

  <rect x="782" y="298" width="248" height="108" class="ocr"/>
  <text x="804" y="328" class="title">OCR 输入收敛</text>
  <text x="804" y="354" class="body">_select_ocr_frames_for_ocr</text>
  <text x="804" y="374" class="body">按 timestamp 去重</text>
  <text x="804" y="394" class="body">按窗口预算选代表帧</text>

  <rect x="134" y="500" width="210" height="96" class="out"/>
  <text x="156" y="530" class="title">raw_all</text>
  <text x="156" y="556" class="body">全局去重前候选</text>
  <text x="156" y="576" class="body">keyframes_raw_all/</text>

  <rect x="392" y="500" width="210" height="96" class="out"/>
  <text x="414" y="530" class="title">raw</text>
  <text x="414" y="556" class="body">最终关键帧</text>
  <text x="414" y="576" class="body">keyframes_raw/</text>

  <rect x="650" y="500" width="224" height="96" class="out"/>
  <text x="672" y="530" class="title">OCR/VLM 结果</text>
  <text x="672" y="556" class="body">ocr_results.json</text>
  <text x="672" y="576" class="body">keyframes_ocr_selected/</text>

  <rect x="922" y="500" width="178" height="96" class="out"/>
  <text x="944" y="530" class="title">调试清单</text>
  <text x="944" y="556" class="body">duplicates.json</text>
  <text x="944" y="576" class="body">manifest.json</text>

  <path class="line" d="M266 172 H326"/>
  <path class="line" d="M546 172 H606"/>
  <path class="line" d="M836 172 H896"/>
  <path class="line" d="M1003 220 C1003 260 273 260 273 298"/>
  <path class="line" d="M398 352 H468"/>
  <path class="line" d="M712 352 H782"/>
  <path class="line" d="M273 406 C273 454 239 454 239 500"/>
  <path class="line" d="M590 406 C590 454 497 454 497 500"/>
  <path class="line" d="M906 406 C906 454 762 454 762 500"/>
  <path class="dash" d="M712 406 C712 456 1011 456 1011 500"/>

  <text x="62" y="636" class="small">看问题时优先按 statistics.vision、keyframes_raw_all、keyframes_raw、keyframe_duplicates、ocr_results 的顺序排查。</text>
</svg>
