<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Neo4j 日志事件图结构示例</title>
  <desc id="desc">一条 Bluetooth 日志被导入 Neo4j 后，会连接到 case、process、app 和 file 节点，并在 DLDLogEvent 上保留候选标记。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2c3a45" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #17212b; }
      .subtitle { font: 400 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #53606d; }
      .node-title { font: 700 17px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #17212b; }
      .body { font: 400 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #4f5d69; }
      .rel { font: 700 12px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #34404b; }
      .case { fill: #e7f1ff; stroke: #4d86cf; stroke-width: 2; }
      .event { fill: #fff7e6; stroke: #d19a2e; stroke-width: 2.4; }
      .proc { fill: #f0ebff; stroke: #7b61c9; stroke-width: 2; }
      .app { fill: #e5f6ed; stroke: #4c9a6a; stroke-width: 2; }
      .file { fill: #ffe9e6; stroke: #d9685a; stroke-width: 2; }
      .line { stroke: #2c3a45; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .tag { fill: #ffffff; stroke: #cfd7e2; stroke-width: 1.2; }
      .tag-hot { fill: #ffe1df; stroke: #d7564a; stroke-width: 1.2; }
      .tag-ok { fill: #dff3e8; stroke: #4c9a6a; stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="620" />
  <text x="52" y="58" class="title">一条日志进入 Neo4j 后的图结构</text>
  <text x="52" y="84" class="subtitle">图结构保留原始事件、文件、进程和应用关系；候选判断标记挂在 DLDLogEvent 上，方便 Cypher 查询。</text>

  <rect x="70" y="250" width="250" height="104" rx="18" class="case" />
  <text x="94" y="282" class="node-title">DLDCaseImport</text>
  <text x="94" y="310" class="body">case_id: Bluetooth...</text>
  <text x="94" y="334" class="body">records_count: 3034</text>

  <rect x="450" y="160" width="370" height="240" rx="20" class="event" />
  <text x="474" y="195" class="node-title">DLDLogEvent</text>
  <text x="474" y="224" class="body">event_id: log_2232</text>
  <text x="474" y="248" class="body">video_time_ms: 120742</text>
  <text x="474" y="272" class="body">event_type: modified</text>
  <text x="474" y="296" class="body">window_title: 蓝牙文件传送</text>
  <rect x="474" y="318" width="114" height="28" rx="7" class="tag-hot" />
  <text x="488" y="337" class="body">is_candidate</text>
  <rect x="602" y="318" width="150" height="28" rx="7" class="tag-ok" />
  <text x="616" y="337" class="body">transfer_related</text>
  <rect x="474" y="354" width="170" height="28" rx="7" class="tag" />
  <text x="488" y="373" class="body">app: removable_media</text>

  <rect x="930" y="105" width="280" height="88" rx="16" class="proc" />
  <text x="954" y="138" class="node-title">DLDProcess</text>
  <text x="954" y="166" class="body">name: fsquirt.exe</text>

  <rect x="930" y="265" width="280" height="88" rx="16" class="app" />
  <text x="954" y="298" class="node-title">DLDApp</text>
  <text x="954" y="326" class="body">name: fsquirt</text>

  <rect x="885" y="430" width="350" height="108" rx="16" class="file" />
  <text x="909" y="463" class="node-title">DLDFile</text>
  <text x="909" y="491" class="body">path: .../Recent/客户联系方式1.sql.lnk</text>
  <text x="909" y="515" class="body">case-scoped file id</text>

  <path class="line" d="M320 302 C372 302 392 280 450 280" />
  <text x="346" y="274" class="rel">HAS_EVENT</text>

  <path class="line" d="M820 225 C866 180 880 150 930 150" />
  <text x="842" y="178" class="rel">BY_PROCESS</text>

  <path class="line" d="M820 310 C864 310 884 310 930 310" />
  <text x="844" y="292" class="rel">IN_APP</text>

  <path class="line" d="M820 372 C866 424 880 474 885 484" />
  <text x="828" y="434" class="rel">TOUCHES_FILE</text>
</svg>
