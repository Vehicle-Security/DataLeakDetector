<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">日志挖掘策略原理图</title>
  <desc id="desc">日志经过字段归一化、语义打标、候选事件筛选、窗口画像、窗口合并，最后输出给抽帧器。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#26323d" />
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15" />
    </filter>
    <style>
      .bg { fill: #f7f9fc; }
      .card { fill: #ffffff; stroke: #cfd7e2; stroke-width: 1.4; filter: url(#shadow); }
      .soft { fill: #eef4ff; stroke: #5b8fd6; stroke-width: 1.4; }
      .hot { fill: #ffe7e3; stroke: #d86658; stroke-width: 1.4; }
      .muted { fill: #eef1f4; stroke: #9aa6b2; stroke-width: 1.4; }
      .green { fill: #e5f6ed; stroke: #4c9a6a; stroke-width: 1.4; }
      .title { font: 700 28px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #17212b; }
      .subtitle { font: 400 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #56616d; }
      .label { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1e2a35; }
      .body { font: 400 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #51606f; }
      .small { font: 400 12px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #65717d; }
      .arrow { stroke: #26323d; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1280" height="760" />
  <text x="50" y="58" class="title">日志挖掘：把低层事件变成可执行的抽帧窗口</text>
  <text x="50" y="86" class="subtitle">核心任务是从噪声日志中识别“值得看视频”的时间段，而不是直接判断是否泄密。</text>

  <rect x="50" y="126" width="208" height="146" rx="14" class="card" />
  <text x="74" y="162" class="label">原始日志</text>
  <text x="74" y="194" class="body">event_type</text>
  <text x="74" y="218" class="body">file_path</text>
  <text x="74" y="242" class="body">process / window</text>

  <path class="arrow" d="M258 199 C296 199 300 199 338 199" />

  <rect x="338" y="126" width="220" height="146" rx="14" class="card" />
  <text x="362" y="162" class="label">字段归一化</text>
  <text x="362" y="194" class="body">video_time_ms</text>
  <text x="362" y="218" class="body">flatten_text</text>
  <text x="362" y="242" class="body">normalize_path</text>

  <path class="arrow" d="M558 199 C596 199 600 199 638 199" />

  <rect x="638" y="126" width="250" height="146" rx="14" class="card" />
  <text x="662" y="162" class="label">语义打标</text>
  <rect x="662" y="184" width="132" height="28" rx="7" class="soft" />
  <text x="674" y="203" class="small">sensitive_related</text>
  <rect x="804" y="184" width="58" height="28" rx="7" class="green" />
  <text x="818" y="203" class="small">sink</text>
  <rect x="662" y="224" width="108" height="28" rx="7" class="hot" />
  <text x="674" y="243" class="small">explicit_upload</text>
  <rect x="780" y="224" width="82" height="28" rx="7" class="muted" />
  <text x="792" y="243" class="small">risky_app</text>

  <path class="arrow" d="M888 199 C926 199 930 199 968 199" />

  <rect x="968" y="126" width="252" height="146" rx="14" class="card" />
  <text x="992" y="162" class="label">候选事件</text>
  <text x="992" y="194" class="body">有可疑动作或敏感线索</text>
  <text x="992" y="218" class="body">保留事件时间和上下文应用</text>
  <text x="992" y="242" class="body">噪声事件不直接触发窗口</text>

  <path class="arrow" d="M1094 272 C1094 310 1094 318 1094 356" />

  <rect x="840" y="356" width="380" height="176" rx="14" class="card" />
  <text x="864" y="392" class="label">窗口画像</text>
  <rect x="864" y="414" width="92" height="32" rx="8" class="hot" />
  <text x="884" y="436" class="body">strong</text>
  <text x="974" y="436" class="body">短窗口、高频、低差分阈值</text>
  <rect x="864" y="456" width="92" height="32" rx="8" class="soft" />
  <text x="878" y="478" class="body">medium</text>
  <text x="974" y="478" class="body">长上下文、常规采样</text>
  <rect x="864" y="498" width="92" height="32" rx="8" class="muted" />
  <text x="888" y="520" class="body">weak</text>
  <text x="974" y="520" class="body">风险提示、低频补充</text>

  <path class="arrow" d="M840 444 C802 444 792 444 754 444" />

  <rect x="452" y="356" width="302" height="176" rx="14" class="card" />
  <text x="476" y="392" class="label">窗口合并</text>
  <text x="476" y="424" class="body">同优先级重叠窗口合并</text>
  <text x="476" y="448" class="body">保留更密步长和更低阈值</text>
  <text x="476" y="472" class="body">合并 active_apps 与 anchor_ms</text>
  <text x="476" y="496" class="body">输出 AnalysisWindow 列表</text>

  <path class="arrow" d="M452 444 C414 444 406 444 368 444" />

  <rect x="50" y="356" width="318" height="176" rx="14" class="card" />
  <text x="74" y="392" class="label">交给抽帧器</text>
  <text x="74" y="424" class="body">start_ms / end_ms</text>
  <text x="74" y="448" class="body">step_ms / max_keyframes</text>
  <text x="74" y="472" class="body">diff_threshold / anchor_ms</text>
  <text x="74" y="496" class="body">active_apps 给 VLM 作提示</text>

  <rect x="50" y="606" width="1170" height="84" rx="14" fill="#ffffff" stroke="#cfd7e2" stroke-width="1.4" />
  <text x="74" y="638" class="label">两种实现路径</text>
  <text x="74" y="666" class="body">InMemory：直接扫描 Python 对象，开发最快；Neo4j：导入日志图、复用 fingerprint、用 Cypher 查询候选事件和邻近活跃应用，适合固定样例反复调试和长日志。</text>
</svg>
