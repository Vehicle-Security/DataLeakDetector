<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">改进后顺序解码流程</title>
  <desc id="desc">展示把相近 timestamp 分组，组内只 seek 一次并顺序读取，减少视频解码成本。</desc>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .axis { stroke: #334155; stroke-width: 2; }
      .tick { stroke: #64748b; stroke-width: 1; }
      .probe { fill: #2563eb; }
      .anchor { fill: #e11d48; }
      .group { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 8; }
      .seek { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; rx: 8; }
      .read { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; rx: 8; }
      .title { font-size: 17px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 12px; fill: #475569; }
      .line { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow2); }
    </style>
  </defs>

  <rect x="24" y="24" width="1072" height="432" fill="#ffffff" stroke="#cbd5e1" rx="12"/>
  <text x="52" y="58" class="title">顺序解码减少重复 seek</text>
  <text x="52" y="80" class="small">相邻 probe 小于等于 5s 时放入同组；组内只 seek 到第一个时间点，然后顺序 read。</text>

  <line x1="92" y1="150" x2="1028" y2="150" class="axis"/>
  <text x="92" y="124" class="small">probe timestamps</text>
  <circle cx="140" cy="150" r="7" class="probe"/>
  <circle cx="198" cy="150" r="7" class="probe"/>
  <circle cx="254" cy="150" r="7" class="anchor"/>
  <circle cx="320" cy="150" r="7" class="probe"/>
  <circle cx="520" cy="150" r="7" class="probe"/>
  <circle cx="580" cy="150" r="7" class="anchor"/>
  <circle cx="642" cy="150" r="7" class="probe"/>
  <circle cx="900" cy="150" r="7" class="probe"/>

  <rect x="116" y="198" width="230" height="58" class="group"/>
  <text x="144" y="232" class="body">group 1：相邻间隔 &lt;= 5s</text>
  <rect x="496" y="198" width="172" height="58" class="group"/>
  <text x="522" y="232" class="body">group 2</text>
  <rect x="858" y="198" width="88" height="58" class="group"/>
  <text x="882" y="232" class="body">单点</text>

  <path class="line" d="M230 256 V300"/>
  <path class="line" d="M582 256 V300"/>
  <path class="line" d="M902 256 V300"/>

  <rect x="100" y="300" width="258" height="78" class="seek"/>
  <text x="128" y="330" class="title">seek 一次</text>
  <text x="128" y="356" class="body">跳到组内第一个 timestamp</text>

  <rect x="456" y="300" width="258" height="78" class="read"/>
  <text x="484" y="330" class="title">顺序 read</text>
  <text x="484" y="356" class="body">沿时间推进，分配给目标 timestamp</text>

  <rect x="812" y="300" width="194" height="78" class="seek"/>
  <text x="840" y="330" class="title">单点直接 seek</text>
  <text x="840" y="356" class="body">无需顺序扫一段</text>

  <path class="line" d="M358 339 H456"/>
  <text x="168" y="420" class="small">蓝点：普通 probe</text>
  <text x="330" y="420" class="small">红点：anchor probe</text>
  <circle cx="150" cy="416" r="6" class="probe"/>
  <circle cx="312" cy="416" r="6" class="anchor"/>
</svg>
