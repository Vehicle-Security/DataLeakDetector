<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">DataLeakDetector 非均匀抽帧原理图</title>
  <desc id="desc">操作日志先生成 strong、medium、weak 分析窗口，抽帧器按窗口优先级和视觉变化选择关键帧，再交给 OCR、VLM 和 Datalog。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f3b45" />
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.16" />
    </filter>
    <style>
      .bg { fill: #f7f8fb; }
      .card { fill: #ffffff; stroke: #cfd6de; stroke-width: 1.4; filter: url(#shadow); }
      .title { font: 700 28px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #18212b; }
      .subtitle { font: 400 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #56616d; }
      .label { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2a34; }
      .body { font: 400 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #53606c; }
      .small { font: 400 12px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #65717c; }
      .arrow { stroke: #2f3b45; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .timeline { stroke: #34404b; stroke-width: 4; stroke-linecap: round; }
      .tick { stroke: #34404b; stroke-width: 2; }
      .medium { fill: #d8e8ff; stroke: #4b82cf; }
      .strong { fill: #ffe1df; stroke: #d7564a; }
      .weak { fill: #eceff3; stroke: #8a97a3; }
      .frame { fill: #ffffff; stroke-width: 2; }
      .frame-medium { stroke: #4b82cf; }
      .frame-strong { stroke: #d7564a; }
      .drop { fill: #dfe4ea; stroke: #aab3bc; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="720" />
  <text x="48" y="58" class="title">非均匀抽帧：让日志决定“去哪看”，让画面变化决定“留哪帧”</text>
  <text x="48" y="86" class="subtitle">目标不是平均覆盖整段录屏，而是在可疑事件附近保留可供 OCR/VLM/Datalog 使用的证据帧。</text>

  <rect x="48" y="125" width="210" height="132" rx="12" class="card" />
  <text x="72" y="160" class="label">1. 操作日志</text>
  <text x="72" y="190" class="body">file_selected</text>
  <text x="72" y="214" class="body">upload_complete</text>
  <text x="72" y="238" class="body">app_switch / fsquirt</text>

  <path class="arrow" d="M258 191 C296 191 300 191 338 191" />

  <rect x="338" y="125" width="250" height="132" rx="12" class="card" />
  <text x="362" y="160" class="label">2. 日志挖掘成窗口</text>
  <rect x="362" y="182" width="74" height="28" rx="7" class="strong" />
  <text x="374" y="201" class="small">strong</text>
  <rect x="446" y="182" width="82" height="28" rx="7" class="medium" />
  <text x="458" y="201" class="small">medium</text>
  <text x="362" y="234" class="body">不同窗口有不同步长、阈值和上限</text>

  <path class="arrow" d="M588 191 C626 191 630 191 668 191" />

  <rect x="668" y="125" width="260" height="132" rx="12" class="card" />
  <text x="692" y="160" class="label">3. 视觉变化筛选</text>
  <text x="692" y="190" class="body">160×90 灰度缩略图差分</text>
  <text x="692" y="214" class="body">16×16 感知哈希近重复判断</text>
  <text x="692" y="238" class="body">锚点帧优先保留</text>

  <path class="arrow" d="M928 191 C966 191 970 191 1008 191" />

  <rect x="1008" y="125" width="224" height="132" rx="12" class="card" />
  <text x="1032" y="160" class="label">4. 证据链路</text>
  <text x="1032" y="190" class="body">OCR 读取关键帧文本</text>
  <text x="1032" y="214" class="body">VLM 补全屏幕语义</text>
  <text x="1032" y="238" class="body">Datalog 推理泄密路径</text>

  <line x1="80" y1="365" x2="1200" y2="365" class="timeline" />
  <text x="80" y="338" class="label">视频时间轴</text>
  <text x="80" y="395" class="small">0s</text>
  <text x="350" y="395" class="small">60s</text>
  <text x="620" y="395" class="small">120s</text>
  <text x="895" y="395" class="small">180s</text>
  <text x="1164" y="395" class="small">240s</text>
  <line x1="80" y1="354" x2="80" y2="376" class="tick" />
  <line x1="360" y1="354" x2="360" y2="376" class="tick" />
  <line x1="640" y1="354" x2="640" y2="376" class="tick" />
  <line x1="920" y1="354" x2="920" y2="376" class="tick" />
  <line x1="1200" y1="354" x2="1200" y2="376" class="tick" />

  <rect x="105" y="430" width="570" height="48" rx="10" class="medium" />
  <text x="124" y="460" class="label">medium 窗口：较长上下文，约 1s 一个候选点</text>

  <rect x="606" y="505" width="245" height="48" rx="10" class="strong" />
  <text x="625" y="535" class="label">strong 窗口：短而密，约 250ms 候选点</text>

  <text x="105" y="518" class="small">候选点很多，但只有发生明显变化、靠近锚点、且非重复的画面会留下。</text>
  <text x="606" y="593" class="small">文件选择/上传/传输这类快速过程，用更低阈值捕获小弹窗和局部变化。</text>

  <rect x="150" y="300" width="44" height="34" rx="5" class="frame frame-medium" />
  <rect x="240" y="300" width="44" height="34" rx="5" class="drop" />
  <rect x="334" y="300" width="44" height="34" rx="5" class="frame frame-medium" />
  <rect x="520" y="300" width="44" height="34" rx="5" class="frame frame-medium" />
  <rect x="650" y="300" width="44" height="34" rx="5" class="frame frame-strong" />
  <rect x="700" y="300" width="44" height="34" rx="5" class="frame frame-strong" />
  <rect x="750" y="300" width="44" height="34" rx="5" class="frame frame-strong" />
  <rect x="800" y="300" width="44" height="34" rx="5" class="drop" />
  <text x="148" y="286" class="small">保留</text>
  <text x="236" y="286" class="small">重复丢弃</text>
  <text x="648" y="286" class="small">高频关键状态</text>

  <rect x="80" y="620" width="1120" height="52" rx="12" fill="#ffffff" stroke="#cfd6de" stroke-width="1.4" />
  <text x="104" y="653" class="body">输出：keyframes_raw/ 保存最终关键帧；keyframe_duplicates.json 记录被去掉的重复帧；ocr_results.json 保存 OCR 证据。</text>
</svg>
