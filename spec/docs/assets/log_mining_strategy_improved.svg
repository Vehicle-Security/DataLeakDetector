<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">改进后日志挖掘总流程</title>
  <desc id="desc">从数据样例发现、时间轴归一化、可选 Neo4j、候选信号、优先级、窗口合并到抽帧输入的流程图。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.4; rx: 8; }
      .strong { fill: #fff1f2; stroke: #e11d48; }
      .medium { fill: #eef6ff; stroke: #2563eb; }
      .neo { fill: #f0fdf4; stroke: #16a34a; }
      .drop { fill: #f7f7f5; stroke: #a3a3a3; }
      .title { font-size: 17px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 12px; fill: #475569; }
      .line { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect x="24" y="24" width="1072" height="472" fill="#ffffff" stroke="#cbd5e1" rx="12"/>
  <text x="52" y="58" class="title">日志挖掘策略（改进后）</text>
  <text x="52" y="80" class="small">目标：把日志噪声压缩成少量可抽帧窗口，不在此处直接判定泄漏。</text>

  <rect x="52" y="120" width="140" height="92" class="box"/>
  <text x="72" y="148" class="title">样例发现</text>
  <text x="72" y="174" class="body">日志 / 视频</text>
  <text x="72" y="194" class="body">groundtruth / INDEX</text>

  <rect x="232" y="120" width="158" height="92" class="box"/>
  <text x="252" y="148" class="title">时间轴归一化</text>
  <text x="252" y="174" class="body">relative_timestamp</text>
  <text x="252" y="194" class="body">recording_start_time</text>

  <rect x="430" y="104" width="166" height="124" class="neo"/>
  <text x="450" y="132" class="title">可选 Neo4j</text>
  <text x="450" y="158" class="body">fingerprint 复用</text>
  <text x="450" y="178" class="body">候选事件查询</text>
  <text x="450" y="198" class="body">失败自动 fallback</text>

  <rect x="638" y="120" width="154" height="92" class="box"/>
  <text x="658" y="148" class="title">候选信号</text>
  <text x="658" y="174" class="body">sensitive / transfer</text>
  <text x="658" y="194" class="body">sink / explicit upload</text>

  <rect x="832" y="64" width="194" height="72" class="strong"/>
  <text x="852" y="92" class="title">strong</text>
  <text x="852" y="116" class="body">短窗口，高密度，24 帧预算</text>

  <rect x="832" y="164" width="194" height="72" class="medium"/>
  <text x="852" y="192" class="title">medium</text>
  <text x="852" y="216" class="body">上下文窗口，默认 2 帧 + anchor</text>

  <rect x="832" y="264" width="194" height="72" class="drop"/>
  <text x="852" y="292" class="title">weak / none</text>
  <text x="852" y="316" class="body">弱窗口默认关闭；none 丢弃</text>

  <rect x="430" y="308" width="254" height="112" class="box"/>
  <text x="452" y="338" class="title">合并与过滤</text>
  <text x="452" y="364" class="body">medium 按 5 分钟 case segment 合并</text>
  <text x="452" y="386" class="body">默认丢弃无 anchor medium</text>
  <text x="452" y="408" class="body">保留 active apps 和 anchor_ms</text>

  <rect x="736" y="326" width="230" height="76" class="box"/>
  <text x="758" y="356" class="title">AnalysisWindow</text>
  <text x="758" y="382" class="body">交给顺序解码抽帧 / OCR / VLM</text>

  <path class="line" d="M192 166 H232"/>
  <path class="line" d="M390 166 H430"/>
  <path class="line" d="M596 166 H638"/>
  <path class="line" d="M792 166 C812 166 812 100 832 100"/>
  <path class="line" d="M792 166 C812 166 812 200 832 200"/>
  <path class="line" d="M792 166 C812 166 812 300 832 300"/>
  <path class="line" d="M929 136 C929 252 684 252 604 308"/>
  <path class="line" d="M929 236 C929 276 684 276 604 308"/>
  <path class="line dash" d="M929 336 C900 430 696 456 566 420"/>
  <path class="line" d="M684 364 H736"/>
</svg>
