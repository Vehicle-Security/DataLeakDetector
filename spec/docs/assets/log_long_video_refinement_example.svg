<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">长视频窗口收敛示例</title>
  <desc id="desc">展示旧策略中 medium 窗口在长视频里连成大片，以及改进后按时间对齐、case segment、anchor 过滤收敛成少量窗口。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .axis { stroke: #334155; stroke-width: 2; }
      .old { fill: #fecaca; stroke: #dc2626; stroke-width: 1.5; rx: 6; }
      .medium { fill: #bfdbfe; stroke: #2563eb; stroke-width: 1.5; rx: 6; }
      .strong { fill: #fb7185; stroke: #be123c; stroke-width: 1.5; rx: 6; }
      .drop { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1.5; rx: 6; }
      .box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.2; rx: 8; }
      .title { font-size: 17px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 12px; fill: #475569; }
      .line { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 6 6; }
    </style>
  </defs>

  <rect x="24" y="24" width="1072" height="472" fill="#ffffff" stroke="#cbd5e1" rx="12"/>
  <text x="52" y="58" class="title">长视频里真正爆炸的是窗口，不是 OCR 本身</text>
  <text x="52" y="80" class="small">旧策略把大量系统噪声扩成 medium 上下文；改进后先对齐时间轴，再按 segment 和 anchor 收敛。</text>

  <text x="60" y="132" class="body">旧策略</text>
  <line x1="150" y1="128" x2="1030" y2="128" class="axis"/>
  <rect x="170" y="108" width="260" height="40" class="old"/>
  <rect x="360" y="108" width="300" height="40" class="old"/>
  <rect x="610" y="108" width="250" height="40" class="old"/>
  <rect x="820" y="108" width="160" height="40" class="old"/>
  <text x="214" y="134" class="small">很多 3 分钟 medium 重叠成大片</text>

  <path class="line" d="M590 164 V214"/>

  <rect x="120" y="214" width="220" height="82" class="box"/>
  <text x="142" y="244" class="title">时间轴对齐</text>
  <text x="142" y="270" class="body">recording_start_time / INDEX</text>

  <rect x="450" y="214" width="220" height="82" class="box"/>
  <text x="472" y="244" class="title">按 5 分钟分段</text>
  <text x="472" y="270" class="body">segment 内合并 medium</text>

  <rect x="780" y="214" width="220" height="82" class="box"/>
  <text x="802" y="244" class="title">过滤无 anchor</text>
  <text x="802" y="270" class="body">保留 strong 和关键 medium</text>

  <path class="line" d="M340 255 H450"/>
  <path class="line" d="M670 255 H780"/>

  <text x="60" y="370" class="body">改进后</text>
  <line x1="150" y1="366" x2="1030" y2="366" class="axis"/>
  <line x1="330" y1="338" x2="330" y2="394" class="dash"/>
  <line x1="510" y1="338" x2="510" y2="394" class="dash"/>
  <line x1="690" y1="338" x2="690" y2="394" class="dash"/>
  <line x1="870" y1="338" x2="870" y2="394" class="dash"/>
  <rect x="196" y="346" width="54" height="40" class="medium"/>
  <text x="204" y="371" class="small">anchor</text>
  <rect x="536" y="346" width="72" height="40" class="strong"/>
  <text x="548" y="371" class="small">strong</text>
  <rect x="724" y="346" width="96" height="40" class="drop"/>
  <text x="736" y="371" class="small">丢弃噪声</text>
  <rect x="906" y="346" width="64" height="40" class="strong"/>
  <text x="918" y="371" class="small">strong</text>

  <text x="184" y="432" class="small">少量局部窗口进入抽帧；长视频成本随证据密度增长，而不是随日志噪声线性增长。</text>
</svg>
