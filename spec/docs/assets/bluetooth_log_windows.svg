<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Bluetooth-SensitiveLeak 日志窗口示意图</title>
  <desc id="desc">Bluetooth 样例中，medium 窗口覆盖全局上下文，strong 窗口集中在蓝牙文件传送附近。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9 Z" fill="#24313d" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #17212b; }
      .subtitle { font: 400 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #53606d; }
      .label { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2a34; }
      .small { font: 400 12px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #5f6b76; }
      .timeline { stroke: #2c3a45; stroke-width: 4; stroke-linecap: round; }
      .tick { stroke: #2c3a45; stroke-width: 2; }
      .medium { fill: #d8e8ff; stroke: #4b82cf; stroke-width: 2; }
      .strong { fill: #ffe1df; stroke: #d7564a; stroke-width: 2; }
      .event { fill: #ffffff; stroke: #9aa6b2; stroke-width: 1.4; }
      .event-hot { fill: #fff5f3; stroke: #d7564a; stroke-width: 1.6; }
      .arrow { stroke: #24313d; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1280" height="520" />
  <text x="48" y="58" class="title">Bluetooth-SensitiveLeak：日志窗口如何落到视频时间轴</text>
  <text x="48" y="86" class="subtitle">该样例 3034 条日志最终合并成 2 个分析窗口：一个 medium 上下文窗口，一个 strong 蓝牙传输窗口。</text>

  <line x1="90" y1="190" x2="1190" y2="190" class="timeline" />
  <text x="90" y="162" class="label">视频时间轴</text>
  <text x="82" y="220" class="small">0s</text>
  <text x="300" y="220" class="small">60s</text>
  <text x="520" y="220" class="small">120s</text>
  <text x="740" y="220" class="small">180s</text>
  <text x="960" y="220" class="small">240s</text>
  <text x="1168" y="220" class="small">303s</text>

  <line x1="90" y1="178" x2="90" y2="204" class="tick" />
  <line x1="308" y1="178" x2="308" y2="204" class="tick" />
  <line x1="526" y1="178" x2="526" y2="204" class="tick" />
  <line x1="744" y1="178" x2="744" y2="204" class="tick" />
  <line x1="962" y1="178" x2="962" y2="204" class="tick" />
  <line x1="1190" y1="178" x2="1190" y2="204" class="tick" />

  <rect x="90" y="262" width="1100" height="52" rx="10" class="medium" />
  <text x="112" y="294" class="label">medium 窗口：0s - 303s，负责保留打开敏感文件、浏览器/WPS/桌面等长上下文</text>

  <rect x="508" y="345" width="204" height="52" rx="10" class="strong" />
  <text x="528" y="377" class="label">strong 窗口：114.780s - 171.013s</text>

  <rect x="124" y="112" width="178" height="48" rx="9" class="event" />
  <text x="138" y="132" class="small">18s 左右</text>
  <text x="138" y="150" class="small">打开 文字文稿1.pdf</text>
  <path class="arrow" d="M213 160 L154 262" />

  <rect x="402" y="112" width="206" height="48" rx="9" class="event-hot" />
  <text x="416" y="132" class="small">119.780s</text>
  <text x="416" y="150" class="small">app_switch: fsquirt.exe</text>
  <path class="arrow" d="M505 160 L548 345" />

  <rect x="652" y="112" width="230" height="48" rx="9" class="event-hot" />
  <text x="666" y="132" class="small">120s - 150s</text>
  <text x="666" y="150" class="small">Recent 文件 / upload_detection</text>
  <path class="arrow" d="M767 160 L650 345" />

  <rect x="928" y="112" width="214" height="48" rx="9" class="event" />
  <text x="942" y="132" class="small">143s - 150s</text>
  <text x="942" y="150" class="small">敏感/派生痕迹继续出现</text>
  <path class="arrow" d="M1035 160 L690 345" />

  <text x="90" y="448" class="small">解释：medium 不代表每秒都保存图片，只代表抽帧器会在长上下文内尝试采样；最终仍要经过视觉变化和关键帧上限过滤。</text>
  <text x="90" y="472" class="small">优化方向：如果长录屏中 medium 窗口过大，应优先改日志挖掘的窗口收敛，而不是盲目降低抽帧频率。</text>
</svg>
