<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">改进后抽帧总流程</title>
  <desc id="desc">从 AnalysisWindow 到 probe、顺序解码、视觉保留、全局去重、OCR 和 VLM 的流程图。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.4; rx: 8; }
      .hot { fill: #fff1f2; stroke: #e11d48; }
      .cool { fill: #eef6ff; stroke: #2563eb; }
      .ok { fill: #f0fdf4; stroke: #16a34a; }
      .warn { fill: #fffbeb; stroke: #d97706; }
      .title { font-size: 17px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 12px; fill: #475569; }
      .line { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="24" y="24" width="1072" height="472" fill="#ffffff" stroke="#cbd5e1" rx="12"/>
  <text x="52" y="58" class="title">抽帧策略（改进后）</text>
  <text x="52" y="80" class="small">不做全视频均匀抽帧；日志窗口圈定区域，视觉变化和 anchor 决定最终帧。</text>

  <rect x="54" y="128" width="146" height="90" class="box"/>
  <text x="74" y="156" class="title">AnalysisWindow</text>
  <text x="74" y="182" class="body">start / end</text>
  <text x="74" y="202" class="body">step / budget / anchor</text>

  <rect x="242" y="128" width="154" height="90" class="cool"/>
  <text x="262" y="156" class="title">Probe 时间点</text>
  <text x="262" y="182" class="body">anchor + 起止点</text>
  <text x="262" y="202" class="body">按 multiplier 下采样</text>

  <rect x="438" y="128" width="156" height="90" class="cool"/>
  <text x="458" y="156" class="title">顺序解码</text>
  <text x="458" y="182" class="body">5s 内分组</text>
  <text x="458" y="202" class="body">组内 read，组间 seek</text>

  <rect x="636" y="96" width="168" height="122" class="hot"/>
  <text x="656" y="124" class="title">窗口内保留</text>
  <text x="656" y="150" class="body">anchor 强制保留</text>
  <text x="656" y="170" class="body">score >= threshold</text>
  <text x="656" y="190" class="body">exact / hash 去重</text>

  <rect x="846" y="128" width="168" height="90" class="warn"/>
  <text x="866" y="156" class="title">全局去重</text>
  <text x="866" y="182" class="body">strong 优先</text>
  <text x="866" y="202" class="body">近重复 anchor 压缩</text>

  <rect x="194" y="318" width="170" height="82" class="box"/>
  <text x="214" y="348" class="title">keyframes_raw_all</text>
  <text x="214" y="374" class="body">去重前候选全集</text>

  <rect x="414" y="318" width="150" height="82" class="ok"/>
  <text x="434" y="348" class="title">keyframes_raw</text>
  <text x="434" y="374" class="body">最终 OCR 基础输入</text>

  <rect x="614" y="318" width="170" height="82" class="warn"/>
  <text x="634" y="348" class="title">duplicates.json</text>
  <text x="634" y="374" class="body">解释删掉哪些帧</text>

  <rect x="834" y="318" width="170" height="82" class="ok"/>
  <text x="854" y="348" class="title">OCR / VLM</text>
  <text x="854" y="374" class="body">OCR 全量，VLM 少量补全</text>

  <path class="line" d="M200 173 H242"/>
  <path class="line" d="M396 173 H438"/>
  <path class="line" d="M594 173 H636"/>
  <path class="line" d="M804 173 H846"/>
  <path class="line" d="M930 218 C930 272 500 272 280 318"/>
  <path class="line" d="M930 218 C930 292 536 292 490 318"/>
  <path class="line" d="M930 218 C930 292 700 292 700 318"/>
  <path class="line" d="M564 359 H614"/>
  <path class="line" d="M784 359 H834"/>
</svg>
