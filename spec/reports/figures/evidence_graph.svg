<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1280" viewBox="0 0 2200 1280">
  <defs>
    <style>
      .title { font: 700 54px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102033; }
      .subtitle { font: 28px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #52616f; }
      .group-title { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102033; }
      .node-title { font: 700 25px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102033; }
      .body { font: 22px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #203246; }
      .small { font: 19px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #52616f; }
      .group { stroke: #cbd5e1; stroke-width: 2.2; rx: 28; }
      .node { fill: #ffffff; stroke: #8ea3ba; stroke-width: 2.6; rx: 18; }
      .hub { fill: #fff7d6; stroke: #f59e0b; stroke-width: 3; rx: 20; }
      .out { fill: #dcfce7; stroke: #22c55e; stroke-width: 3; rx: 20; }
      .edge { stroke: #4b5f76; stroke-width: 4.6; fill: none; }
      .weak { stroke: #64748b; stroke-width: 3.4; fill: none; stroke-dasharray: 11 9; }
      .label { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5f76"/>
    </marker>
    <marker id="arrow-weak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="2200" height="1280" fill="#ffffff"/>
  <text class="title" x="70" y="82">当前证据结构</text>
  <text class="subtitle" x="74" y="126">不是已落地的 Neo4j 图；当前实现主要落在 CorrelationBundle、file_lineage、UploadCandidate、Datalog facts 和 JSON 报告中</text>

  <rect class="group" x="60" y="175" width="460" height="790" fill="#eff6ff"/>
  <text class="group-title" x="95" y="225">原始观测</text>
  <rect class="group" x="565" y="175" width="470" height="790" fill="#ecfdf3"/>
  <text class="group-title" x="600" y="225">归一化对象</text>
  <rect class="group" x="1080" y="175" width="500" height="790" fill="#fff7d6"/>
  <text class="group-title" x="1115" y="225">CorrelationBundle</text>
  <rect class="group" x="1625" y="175" width="510" height="790" fill="#f5f3ff"/>
  <text class="group-title" x="1660" y="225">推理与报告</text>

  <rect class="node" x="105" y="290" width="350" height="125"/>
  <text class="node-title" x="132" y="330">LogEvent</text>
  <text class="body" x="132" y="368">timestamp / event_type</text>
  <text class="body" x="132" y="398">file_path / window / process</text>

  <rect class="node" x="105" y="500" width="350" height="125"/>
  <text class="node-title" x="132" y="540">FrameRecord</text>
  <text class="body" x="132" y="578">selected frame</text>
  <text class="body" x="132" y="608">OCR / image_sent / scene_score</text>

  <rect class="node" x="105" y="710" width="350" height="125"/>
  <text class="node-title" x="132" y="750">Policy / Sensitive Hint</text>
  <text class="body" x="132" y="788">sensitive_files</text>
  <text class="body" x="132" y="818">blacklist / whitelist</text>

  <rect class="node" x="610" y="275" width="360" height="120"/>
  <text class="node-title" x="637" y="315">NormalizedLogEvent</text>
  <text class="body" x="637" y="353">标准化时间、路径、应用</text>

  <rect class="node" x="610" y="455" width="360" height="120"/>
  <text class="node-title" x="637" y="495">FrontendApp</text>
  <text class="body" x="637" y="533">email / ai_service / cloud</text>

  <rect class="node" x="610" y="635" width="360" height="120"/>
  <text class="node-title" x="637" y="675">FileLineage</text>
  <text class="body" x="637" y="713">direct mappings / full chains</text>

  <rect class="node" x="610" y="810" width="360" height="110"/>
  <text class="node-title" x="637" y="850">FrameSegment</text>
  <text class="body" x="637" y="888">VLM/视觉观察片段</text>

  <rect class="hub" x="1130" y="250" width="390" height="125"/>
  <text class="node-title" x="1157" y="290">analysis_windows</text>
  <text class="body" x="1157" y="328">可疑时间窗和 post buffer</text>

  <rect class="hub" x="1130" y="435" width="390" height="125"/>
  <text class="node-title" x="1157" y="475">correlated_events</text>
  <text class="body" x="1157" y="513">日志 + segment 绑定</text>

  <rect class="hub" x="1130" y="620" width="390" height="125"/>
  <text class="node-title" x="1157" y="660">upload_candidates</text>
  <text class="body" x="1157" y="698">original_file / current_files / sink</text>

  <rect class="hub" x="1130" y="805" width="390" height="125"/>
  <text class="node-title" x="1157" y="845">operation_records</text>
  <text class="body" x="1157" y="883">报告和推理的中间记录</text>

  <rect class="node" x="1675" y="285" width="390" height="125"/>
  <text class="node-title" x="1702" y="325">Datalog Facts</text>
  <text class="body" x="1702" y="363">Open / Transfer / CrossProcess / Leak</text>

  <rect class="out" x="1675" y="500" width="390" height="125"/>
  <text class="node-title" x="1702" y="540">leak_paths</text>
  <text class="body" x="1702" y="578">污染传播后的泄露路径</text>

  <rect class="out" x="1675" y="715" width="390" height="125"/>
  <text class="node-title" x="1702" y="755">full_evidence JSON</text>
  <text class="body" x="1702" y="793">summary + bundle + facts + paths</text>

  <path class="edge" marker-end="url(#arrow)" d="M455 352 C520 352 545 335 610 335"/>
  <path class="edge" marker-end="url(#arrow)" d="M455 562 C530 562 540 865 610 865"/>
  <path class="edge" marker-end="url(#arrow)" d="M455 772 C530 772 540 695 610 695"/>
  <path class="edge" marker-end="url(#arrow)" d="M970 335 C1045 335 1055 312 1130 312"/>
  <path class="edge" marker-end="url(#arrow)" d="M970 515 C1045 515 1055 497 1130 497"/>
  <path class="edge" marker-end="url(#arrow)" d="M970 695 C1045 695 1055 682 1130 682"/>
  <path class="edge" marker-end="url(#arrow)" d="M970 865 C1045 865 1055 867 1130 867"/>
  <path class="edge" marker-end="url(#arrow)" d="M1520 682 C1595 682 1600 347 1675 347"/>
  <path class="edge" marker-end="url(#arrow)" d="M1870 410 L1870 500"/>
  <path class="edge" marker-end="url(#arrow)" d="M1870 625 L1870 715"/>
  <path class="edge" marker-end="url(#arrow)" d="M1520 497 C1600 497 1600 777 1675 777"/>

  <path class="weak" marker-end="url(#arrow-weak)" d="M2065 777 C2140 777 2140 1110 1325 1110 C760 1110 760 920 790 920"/>
  <text class="small" x="1050" y="1092">误报/漏报回流到窗口构建、lineage、VLM segment 和 Datalog fact 映射</text>

  <text class="small" x="70" y="1195">说明：Neo4j 写入仍属于后续计划；本图只描述当前代码已经输出或消费的数据结构。</text>
</svg>
