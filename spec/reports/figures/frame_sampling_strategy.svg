<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500">
  <defs>
    <style>
      .title { font: 700 54px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102033; }
      .subtitle { font: 28px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #52616f; }
      .lane-title { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102033; }
      .card-title { font: 700 25px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102033; }
      .body { font: 22px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #203246; }
      .small { font: 19px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #52616f; }
      .mono { font: 700 20px Consolas, "Microsoft YaHei", monospace; fill: #334155; }
      .lane { stroke: #cbd5e1; stroke-width: 2; rx: 28; }
      .card { fill: #ffffff; stroke: #8ea3ba; stroke-width: 2.6; rx: 18; }
      .focus { fill: #fff7d6; stroke: #f59e0b; stroke-width: 3; rx: 20; }
      .output { fill: #dcfce7; stroke: #22c55e; stroke-width: 3; rx: 20; }
      .audit { fill: #ede9fe; stroke: #a78bfa; stroke-width: 3; rx: 20; }
      .risk { fill: #fee2e2; stroke: #f87171; stroke-width: 3; rx: 20; }
      .edge { stroke: #4b5f76; stroke-width: 4.5; fill: none; }
      .dash { stroke: #64748b; stroke-width: 3.2; fill: none; stroke-dasharray: 11 9; }
      .tick { stroke: #475569; stroke-width: 3; }
      .axis { stroke: #334155; stroke-width: 4; fill: none; }
      .frame { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 10; }
      .selected { fill: #dcfce7; stroke: #16a34a; stroke-width: 3; rx: 10; }
      .textonly { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2.5; rx: 10; }
      .anchor { fill: #fee2e2; stroke: #ef4444; stroke-width: 3; rx: 10; }
      .label { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5f76"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="2400" height="1500" fill="#ffffff"/>
  <text class="title" x="70" y="82">当前 NAS live VLM 抽帧流程</text>
  <text class="subtitle" x="74" y="126">对应 tools/benchmark_nas_samples.py：先选高信号复核片段，再用事件锚点、场景变化、OCR 和图片预算生成 VLM payload</text>

  <rect class="lane" x="60" y="175" width="520" height="1110" fill="#eff6ff"/>
  <rect class="lane" x="625" y="175" width="520" height="1110" fill="#fff7d6"/>
  <rect class="lane" x="1190" y="175" width="530" height="1110" fill="#ecfdf3"/>
  <rect class="lane" x="1765" y="175" width="575" height="1110" fill="#f5f3ff"/>
  <text class="lane-title" x="100" y="225">1. 复核窗口与帧预算</text>
  <text class="lane-title" x="665" y="225">2. 候选时间点生成</text>
  <text class="lane-title" x="1230" y="225">3. 候选帧解码与入选</text>
  <text class="lane-title" x="1805" y="225">4. OCR / 图片预算 / VLM</text>

  <g filter="url(#soft-shadow)">
    <rect class="card" x="105" y="280" width="420" height="145"/>
    <text class="card-title" x="135" y="322">fallback meta -> windows</text>
    <text class="body" x="135" y="360">来自 build_analysis_windows</text>
    <text class="body" x="135" y="392">包含敏感 anchor、候选事件、原因</text>

    <rect class="card" x="105" y="485" width="420" height="170"/>
    <text class="card-title" x="135" y="527">merge / split review segments</text>
    <text class="body" x="135" y="565">合并间隔：DLD_VLM_WINDOW_MERGE_GAP_SECONDS</text>
    <text class="body" x="135" y="597">切片：DLD_VLM_SEGMENT_SECONDS</text>
    <text class="body" x="135" y="629">最多保留：DLD_VLM_MAX_SEGMENTS_PER_CASE</text>

    <rect class="focus" x="105" y="720" width="420" height="185"/>
    <text class="card-title" x="135" y="762">segment_signal_score</text>
    <text class="body" x="135" y="800">candidate_events + token hit</text>
    <text class="body" x="135" y="832">log_hits + duration</text>
    <text class="body" x="135" y="864">只保留分数最高的片段</text>

    <rect class="card" x="105" y="970" width="420" height="165"/>
    <text class="card-title" x="135" y="1012">adaptive frame budget</text>
    <text class="body" x="135" y="1050">base/min/max frames</text>
    <text class="body" x="135" y="1082">按窗口长度、事件数、VM/会议/AI 等上下文加帧</text>

    <rect class="card" x="665" y="280" width="420" height="170"/>
    <text class="card-title" x="695" y="322">event anchor candidates</text>
    <text class="body" x="695" y="360">优先从 candidate_events 和 logs 找动作锚点</text>
    <text class="mono" x="695" y="395">upload/send: -3,0,5,12,25,45s</text>
    <text class="mono" x="695" y="425">clipboard/paste: 0,3,8,15,30s</text>

    <rect class="card" x="665" y="515" width="420" height="150"/>
    <text class="card-title" x="695" y="557">window candidates</text>
    <text class="body" x="695" y="595">按片段时长比例分配剩余候选点</text>
    <text class="mono" x="695" y="628">candidate_budget=max(max_frames, env)</text>

    <rect class="card" x="665" y="730" width="420" height="150"/>
    <text class="card-title" x="695" y="772">dedupe + fallback</text>
    <text class="body" x="695" y="810">毫秒级时间戳去重</text>
    <text class="body" x="695" y="842">若无候选则回退 _sample_frame_times</text>

    <rect class="focus" x="665" y="950" width="420" height="185"/>
    <text class="card-title" x="695" y="992">候选时间轴</text>
    <line class="axis" x1="715" y1="1065" x2="1035" y2="1065"/>
    <circle cx="735" cy="1065" r="12" fill="#ef4444"/>
    <circle cx="790" cy="1065" r="8" fill="#f59e0b"/>
    <circle cx="850" cy="1065" r="8" fill="#f59e0b"/>
    <circle cx="915" cy="1065" r="12" fill="#ef4444"/>
    <circle cx="990" cy="1065" r="8" fill="#f59e0b"/>
    <text class="small" x="712" y="1108">anchor</text>
    <text class="small" x="885" y="1108">window</text>

    <rect class="card" x="1230" y="280" width="430" height="150"/>
    <text class="card-title" x="1260" y="322">sparse seek / decode</text>
    <text class="body" x="1260" y="360">只读取候选帧</text>
    <text class="body" x="1260" y="392">按 recording_start 映射 frame_index</text>

    <rect class="focus" x="1230" y="490" width="430" height="170"/>
    <text class="card-title" x="1260" y="532">thumbnail scene score</text>
    <text class="body" x="1260" y="570">96x54 灰度缩略图</text>
    <text class="mono" x="1260" y="605">mean(absdiff(prev,current))/255</text>
    <text class="body" x="1260" y="637">第一帧 scene_score=1.0</text>

    <rect class="output" x="1230" y="725" width="430" height="210"/>
    <text class="card-title" x="1260" y="767">representative selection</text>
    <text class="body" x="1260" y="805">先保留 event_anchor 帧</text>
    <text class="body" x="1260" y="837">再保留 window_start / mid / end</text>
    <text class="body" x="1260" y="869">再按 scene_score + min_frame_gap 补帧</text>
    <text class="body" x="1260" y="901">不足时 scene_change_fallback</text>

    <rect class="card" x="1230" y="1000" width="430" height="135"/>
    <text class="card-title" x="1260" y="1042">selected frames</text>
    <rect class="anchor" x="1260" y="1062" width="76" height="48"/>
    <rect class="selected" x="1350" y="1062" width="76" height="48"/>
    <rect class="selected" x="1440" y="1062" width="76" height="48"/>
    <rect class="selected" x="1530" y="1062" width="76" height="48"/>

    <rect class="focus" x="1810" y="280" width="470" height="190"/>
    <text class="card-title" x="1840" y="322">OCR annotate selected frames</text>
    <text class="body" x="1840" y="360">按 start/end + scene_score 排序选 OCR 帧</text>
    <text class="body" x="1840" y="392">输出 completion_keyword / sensitive_name_visible</text>
    <text class="body" x="1840" y="424">检测 duplicate OCR 和监控 UI 噪声</text>

    <rect class="output" x="1810" y="535" width="470" height="205"/>
    <text class="card-title" x="1840" y="577">image priority -> image_sent</text>
    <text class="body" x="1840" y="615">boundary / event_anchor / OCR hit / scene_change 加权</text>
    <text class="body" x="1840" y="647">duplicate / monitor UI 降权</text>
    <text class="body" x="1840" y="679">限制 max_image_frames，保底 min_image_frames</text>
    <text class="body" x="1840" y="711">未发图帧保留为 text-only context</text>

    <rect class="audit" x="1810" y="805" width="470" height="170"/>
    <text class="card-title" x="1840" y="847">VLM payload</text>
    <text class="body" x="1840" y="885">每帧都有文字说明：frame_index、reason、scene_score</text>
    <text class="body" x="1840" y="917">仅 image_sent=true 附带 JPEG/base64 原图</text>
    <text class="body" x="1840" y="949">image_sent=false 只作为 OCR/时间线补充</text>

    <rect class="risk" x="1810" y="1040" width="470" height="165"/>
    <text class="card-title" x="1840" y="1082">local OCR gate / remote VLM</text>
    <text class="body" x="1840" y="1120">OCR 同时命中完成态和敏感名，可 local_ocr_positive</text>
    <text class="body" x="1840" y="1152">否则调用远端 VLM，并写入 frame_selection 审计字段</text>
  </g>

  <path class="edge" marker-end="url(#arrow)" d="M315 425 L315 485"/>
  <path class="edge" marker-end="url(#arrow)" d="M315 655 L315 720"/>
  <path class="edge" marker-end="url(#arrow)" d="M315 905 L315 970"/>
  <path class="edge" marker-end="url(#arrow)" d="M525 1052 C590 1052 600 365 665 365"/>
  <path class="edge" marker-end="url(#arrow)" d="M875 450 L875 515"/>
  <path class="edge" marker-end="url(#arrow)" d="M875 665 L875 730"/>
  <path class="edge" marker-end="url(#arrow)" d="M875 880 L875 950"/>
  <path class="edge" marker-end="url(#arrow)" d="M1085 1042 C1150 1042 1165 355 1230 355"/>
  <path class="edge" marker-end="url(#arrow)" d="M1445 430 L1445 490"/>
  <path class="edge" marker-end="url(#arrow)" d="M1445 660 L1445 725"/>
  <path class="edge" marker-end="url(#arrow)" d="M1445 935 L1445 1000"/>
  <path class="edge" marker-end="url(#arrow)" d="M1660 1068 C1730 1068 1740 375 1810 375"/>
  <path class="edge" marker-end="url(#arrow)" d="M2045 470 L2045 535"/>
  <path class="edge" marker-end="url(#arrow)" d="M2045 740 L2045 805"/>
  <path class="edge" marker-end="url(#arrow)" d="M2045 975 L2045 1040"/>

  <path class="dash" marker-end="url(#arrow-muted)" d="M2280 1125 C2345 1125 2345 1335 1195 1335 C360 1335 360 1135 525 1100"/>
  <text class="small" x="825" y="1320">误报/漏报回看后，主要调 candidate_frames、anchor 候选数、min_frame_gap、max/min image frames、OCR gate 和完成态 prompt</text>

  <rect class="card" x="95" y="1195" width="485" height="145" fill="#f8fafc"/>
  <text class="card-title" x="125" y="1237">窗口约束</text>
  <text class="body" x="125" y="1275">抽帧只发生在 fallback review segments 内，先通过日志</text>
  <text class="body" x="125" y="1307">信号筛掉低价值时间段，再进入候选帧生成。</text>

  <rect class="card" x="665" y="1195" width="500" height="145" fill="#f8fafc"/>
  <text class="card-title" x="695" y="1237">图片预算</text>
  <text class="body" x="695" y="1275">所有 selected frames 都进入文字上下文；只有 image_sent=true</text>
  <text class="body" x="695" y="1307">的帧才附带真实图片。</text>

  <rect class="card" x="1245" y="1195" width="500" height="145" fill="#f8fafc"/>
  <text class="card-title" x="1275" y="1237">审计字段</text>
  <text class="body" x="1275" y="1275">frame_plan 和 frame_selection 记录 segment、候选数、OCR、</text>
  <text class="body" x="1275" y="1307">image_priority 与每帧入选原因。</text>

  <text class="small" x="70" y="1430">对应当前代码路径：_adaptive_vlm_frame_budget -> _prepare_review_segments -> _frame_time_candidates -> _select_representative_frames -> _annotate_and_limit_image_frames -> _live_vlm_review_case。</text>
</svg>
