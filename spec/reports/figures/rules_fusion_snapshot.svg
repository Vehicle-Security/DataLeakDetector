<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1240" viewBox="0 0 2200 1240">
  <defs>
    <style>
      .title { font: 700 52px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102033; }
      .sub { font: 26px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #52616f; }
      .h { font: 700 31px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102033; }
      .body { font: 24px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #203246; }
      .small { font: 20px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #52616f; }
      .mono { font: 700 22px Consolas, "Microsoft YaHei", monospace; fill: #334155; }
      .card { fill: #fff; stroke: #8ea3ba; stroke-width: 3; rx: 18; }
      .green { fill: #ecfdf3; }
      .yellow { fill: #fff7d6; }
      .blue { fill: #eff6ff; }
      .red { fill: #fff1f2; }
      .purple { fill: #f5f3ff; }
      .line { stroke: #475569; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .bar0 { fill: #dbeafe; }
      .bar1 { fill: #bbf7d0; }
      .bar2 { fill: #fde68a; }
      .bar3 { fill: #fecdd3; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="2200" height="1240" fill="#ffffff"/>
  <text class="title" x="80" y="90">当前规则融合口径</text>
  <text class="sub" x="82" y="138">目标：把确定性日志的 0 FP、VLM 的 UI 语义、Datalog 的路径解释合成一个可复盘判定。</text>

  <rect class="card green" x="90" y="235" width="430" height="250"/>
  <text class="h" x="130" y="292">1. 先找强日志事实</text>
  <text class="body" x="130" y="340">file_selected / upload_event</text>
  <text class="body" x="130" y="378">archive / convert / split</text>
  <text class="body" x="130" y="416">rename_hiding / clipboard_content</text>
  <text class="small" x="130" y="455">命中即保留 evidence，不依赖 VLM 成功。</text>

  <rect class="card yellow" x="625" y="235" width="430" height="250"/>
  <text class="h" x="665" y="292">2. 弱证据交给视觉</text>
  <text class="body" x="665" y="340">敏感 anchor 附近有外部上下文</text>
  <text class="body" x="665" y="378">按 segment 抽少量关键帧</text>
  <text class="body" x="665" y="416">OCR gate / cache / remote VLM</text>
  <text class="small" x="665" y="455">只复核可疑窗口，不看整段视频。</text>

  <rect class="card blue" x="1160" y="235" width="430" height="250"/>
  <text class="h" x="1200" y="292">3. 转成 audit actions</text>
  <text class="body" x="1200" y="340">规则、VLM、关联层统一成动作</text>
  <text class="body" x="1200" y="378">Open / Transfer / Clipboard / Leak</text>
  <text class="body" x="1200" y="416">保留来源和对象绑定</text>
  <text class="small" x="1200" y="455">Datalog 不直接吃原始日志。</text>

  <rect class="card purple" x="1695" y="235" width="410" height="250"/>
  <text class="h" x="1735" y="292">4. 输出两层结论</text>
  <text class="body" x="1735" y="340">risk_positive：风险成立</text>
  <text class="body" x="1735" y="378">confirmed_leak：证据更硬</text>
  <text class="body" x="1735" y="416">错误可回看 facts / paths</text>
  <text class="small" x="1735" y="455">适合继续调 FP/FN 边界。</text>

  <path class="line" d="M520 360 L625 360"/>
  <path class="line" d="M1055 360 L1160 360"/>
  <path class="line" d="M1590 360 L1695 360"/>

  <text class="h" x="110" y="610">最近几轮 replay 结果</text>
  <text class="small" x="112" y="650">同一批 live VLM verdict/cache 上改融合规则，不再消耗远端请求。</text>

  <text class="mono" x="180" y="735">v4</text>
  <rect class="bar0" x="270" y="700" width="760" height="44" rx="8"/>
  <text class="mono" x="1060" y="733">F1 86.27%, FN 49, FP 0</text>

  <text class="mono" x="180" y="825">v5</text>
  <rect class="bar1" x="270" y="790" width="832" height="44" rx="8"/>
  <text class="mono" x="1132" y="823">F1 94.39%, FN 18, FP 4</text>

  <text class="mono" x="180" y="915">v6</text>
  <rect class="bar2" x="270" y="880" width="850" height="44" rx="8"/>
  <text class="mono" x="1150" y="913">F1 96.45%, FN 13, FP 1</text>

  <text class="mono" x="180" y="1005">v7</text>
  <rect class="bar1" x="270" y="970" width="872" height="44" rx="8"/>
  <text class="mono" x="1172" y="1003">F1 96.69%, FN 13, FP 0</text>

  <rect class="card red" x="1450" y="680" width="610" height="360"/>
  <text class="h" x="1490" y="740">仍需要看的边界</text>
  <text class="body" x="1490" y="790">live run 的 18 个错误全部来自 VLM success case</text>
  <text class="body" x="1490" y="835">10 个 FP 多为正常邮箱、网盘、会议、IM</text>
  <text class="body" x="1490" y="880">13 个 replay v7 FN 集中在 AI、会议、复制、OCR、VM</text>
  <text class="body" x="1490" y="925">下一步不是扩大复核，而是细化证据强度</text>
  <text class="small" x="1490" y="980">重点：区分“外部上下文附近”与“确有敏感对象外发”。</text>
</svg>
