<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1200" viewBox="0 0 2200 1200">
  <defs>
    <style>
      .title { font: 700 52px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102033; }
      .sub { font: 26px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #52616f; }
      .h { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102033; }
      .body { font: 24px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #203246; }
      .small { font: 20px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #52616f; }
      .mono { font: 700 22px Consolas, "Microsoft YaHei", monospace; fill: #334155; }
      .card { fill: #fff; stroke: #8ea3ba; stroke-width: 3; rx: 18; }
      .blue { fill: #eff6ff; }
      .green { fill: #ecfdf3; }
      .yellow { fill: #fff7d6; }
      .red { fill: #fff1f2; }
      .gray { fill: #f8fafc; }
      .edge { stroke: #475569; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 4; fill: none; stroke-dasharray: 12 10; marker-end: url(#arrow2); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="2200" height="1200" fill="#ffffff"/>
  <text class="title" x="80" y="90">确定性日志规则：只在强证据上直接命中</text>
  <text class="sub" x="82" y="138">核心不是“敏感词出现就报警”，而是把敏感对象、动作语义、噪声 veto 组合起来。</text>

  <rect class="card blue" x="100" y="235" width="430" height="250"/>
  <text class="h" x="140" y="292">1. 归一化日志</text>
  <text class="body" x="140" y="340">路径统一、时间解析</text>
  <text class="body" x="140" y="378">提取 basename / stem / ext</text>
  <text class="body" x="140" y="416">构建文件事件时间索引</text>

  <rect class="card green" x="620" y="235" width="430" height="250"/>
  <text class="h" x="660" y="292">2. 敏感对象匹配</text>
  <text class="body" x="660" y="340">manifest 文件名 stem</text>
  <text class="body" x="660" y="378">敏感关键词 fallback</text>
  <text class="body" x="660" y="416">剪贴板/窗口标题补充</text>

  <rect class="card yellow" x="1140" y="235" width="430" height="250"/>
  <text class="h" x="1180" y="292">3. 强动作规则</text>
  <text class="body" x="1180" y="340">上传、附件选择、屏幕共享</text>
  <text class="body" x="1180" y="378">压缩、转换、拆分、改名</text>
  <text class="body" x="1180" y="416">富文本剪贴板内容</text>

  <rect class="card red" x="1660" y="235" width="430" height="250"/>
  <text class="h" x="1700" y="292">4. 噪声 veto</text>
  <text class="body" x="1700" y="340">Office 原子保存</text>
  <text class="body" x="1700" y="378">浏览器下载临时文件</text>
  <text class="body" x="1700" y="416">save-as / download rename</text>

  <path class="edge" d="M530 360 L620 360"/>
  <path class="edge" d="M1050 360 L1140 360"/>
  <path class="edge" d="M1570 360 L1660 360"/>

  <rect class="card gray" x="170" y="650" width="850" height="330"/>
  <text class="h" x="215" y="710">典型命中</text>
  <text class="mono" x="215" y="765">file_selected + sensitive.docx</text>
  <text class="body" x="215" y="805">敏感文件进入上传/附件对话框</text>
  <text class="mono" x="215" y="860">created customer.zip</text>
  <text class="body" x="215" y="900">压缩包 stem 命中敏感文件</text>
  <text class="mono" x="215" y="955">clipboard_text rich content</text>
  <text class="body" x="215" y="995">剪贴板中出现多处敏感内容关键词</text>

  <rect class="card gray" x="1180" y="650" width="850" height="330"/>
  <text class="h" x="1225" y="710">典型排除</text>
  <text class="mono" x="1225" y="765">created -> modified same path</text>
  <text class="body" x="1225" y="805">本地保存，不当外发</text>
  <text class="mono" x="1225" y="860">created -> deleted transient file</text>
  <text class="body" x="1225" y="900">浏览器下载/缓存临时文件</text>
  <text class="mono" x="1225" y="955">download then rename</text>
  <text class="body" x="1225" y="995">下载后的重命名，不等价于泄露</text>

  <path class="dash" d="M1355 485 C1355 575, 780 575, 620 650"/>
  <path class="dash" d="M1875 485 C1875 575, 1620 575, 1605 650"/>

  <text class="small" x="80" y="1130">输出：positive、rules、evidence、sensitive_stems、weak_staging。强规则可进入 final，弱 staging 只辅助 VLM 解释。</text>
</svg>
