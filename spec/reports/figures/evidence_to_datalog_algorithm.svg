<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1240" viewBox="0 0 2200 1240">
  <defs>
    <style>
      .title { font: 700 52px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102033; }
      .sub { font: 26px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #52616f; }
      .h { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102033; }
      .body { font: 24px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #203246; }
      .small { font: 20px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #52616f; }
      .mono { font: 700 22px Consolas, "Microsoft YaHei", monospace; fill: #334155; }
      .card { fill: #fff; stroke: #8ea3ba; stroke-width: 3; rx: 18; }
      .blue { fill: #eff6ff; }
      .green { fill: #ecfdf3; }
      .yellow { fill: #fff7d6; }
      .purple { fill: #f5f3ff; }
      .red { fill: #fff1f2; }
      .edge { stroke: #475569; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .node { fill: #f8fafc; stroke: #94a3b8; stroke-width: 3; rx: 14; }
      .leak { fill: #fee2e2; stroke: #ef4444; stroke-width: 4; rx: 14; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="2200" height="1240" fill="#ffffff"/>
  <text class="title" x="80" y="90">从证据到 Datalog：把“看到风险”变成“能解释路径”</text>
  <text class="sub" x="82" y="138">规则、VLM、关联层都先转成统一动作，再生成 facts，最后做污点传播。</text>

  <rect class="card blue" x="90" y="235" width="420" height="250"/>
  <text class="h" x="130" y="292">证据来源</text>
  <text class="body" x="130" y="340">log_rule_signal</text>
  <text class="body" x="130" y="378">live_vlm_verdict</text>
  <text class="body" x="130" y="416">correlation_bundle</text>
  <text class="body" x="130" y="454">operation_records / mappings</text>

  <rect class="card green" x="610" y="235" width="420" height="250"/>
  <text class="h" x="650" y="292">统一动作层</text>
  <text class="body" x="650" y="340">action_type</text>
  <text class="body" x="650" y="378">risk_level</text>
  <text class="body" x="650" y="416">source_file / derived_file</text>
  <text class="body" x="650" y="454">evidence_source</text>

  <rect class="card yellow" x="1130" y="235" width="420" height="250"/>
  <text class="h" x="1170" y="292">Datalog facts</text>
  <text class="mono" x="1170" y="340">OpenFile</text>
  <text class="mono" x="1170" y="378">TransferFile</text>
  <text class="mono" x="1170" y="416">CrossProcessTransfer</text>
  <text class="mono" x="1170" y="454">LeakFile</text>

  <rect class="card purple" x="1650" y="235" width="420" height="250"/>
  <text class="h" x="1690" y="292">推理输出</text>
  <text class="body" x="1690" y="340">risk_support</text>
  <text class="body" x="1690" y="378">leak_paths</text>
  <text class="body" x="1690" y="416">risk_positive</text>
  <text class="body" x="1690" y="454">confirmed_leak</text>

  <path class="edge" d="M510 360 L610 360"/>
  <path class="edge" d="M1030 360 L1130 360"/>
  <path class="edge" d="M1550 360 L1650 360"/>

  <rect class="node" x="180" y="720" width="330" height="90"/>
  <text class="mono" x="220" y="775">OpenFile(source)</text>
  <rect class="node" x="650" y="720" width="370" height="90"/>
  <text class="mono" x="690" y="775">TransferFile(derive)</text>
  <rect class="node" x="1160" y="720" width="430" height="90"/>
  <text class="mono" x="1200" y="775">CrossProcessTransfer</text>
  <rect class="leak" x="1730" y="720" width="330" height="90"/>
  <text class="mono" x="1770" y="775">LeakFile(sink)</text>
  <path class="edge" d="M510 765 L650 765"/>
  <path class="edge" d="M1020 765 L1160 765"/>
  <path class="edge" d="M1590 765 L1730 765"/>

  <rect class="card red" x="390" y="950" width="1420" height="150"/>
  <text class="h" x="435" y="1005">两层结论</text>
  <text class="body" x="435" y="1052">risk_positive：有 Datalog 路径，或有足够强的 risk_support。</text>
  <text class="body" x="435" y="1092">confirmed_leak：真正推出 leak_paths，或命中强日志泄露规则。</text>

  <text class="small" x="80" y="1170">优点：模型看到的动作不会直接变成最终告警，必须经过对象绑定、动作强度、负上下文过滤和路径推理。</text>
</svg>
