<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1280" viewBox="0 0 2200 1280">
  <defs>
    <style>
      .title { font: 700 54px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102033; }
      .subtitle { font: 28px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #52616f; }
      .lane-title { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102033; }
      .card-title { font: 700 25px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102033; }
      .body { font: 22px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #203246; }
      .small { font: 19px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #52616f; }
      .lane { stroke: #cbd5e1; stroke-width: 2.4; rx: 28; }
      .card { fill: #ffffff; stroke: #8ea3ba; stroke-width: 2.6; rx: 18; }
      .warn { fill: #fff7d6; stroke: #f59e0b; stroke-width: 2.8; rx: 18; }
      .out { fill: #dcfce7; stroke: #22c55e; stroke-width: 2.8; rx: 18; }
      .edge { stroke: #4b5f76; stroke-width: 4.6; fill: none; }
      .dash { stroke: #64748b; stroke-width: 3.4; fill: none; stroke-dasharray: 11 9; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5f76"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="2200" height="1280" fill="#ffffff"/>
  <text class="title" x="70" y="82">DataLeakDetector 当前实现架构</text>
  <text class="subtitle" x="74" y="126">以 main/run_e2e.py 和 tools/benchmark_nas_samples.py 为准：日志优先、视觉复核、证据关联、Datalog 推理</text>

  <rect class="lane" x="60" y="180" width="390" height="870" fill="#eff6ff"/>
  <rect class="lane" x="500" y="180" width="390" height="870" fill="#e0f7ff"/>
  <rect class="lane" x="940" y="180" width="520" height="870" fill="#fff7d6"/>
  <rect class="lane" x="1510" y="180" width="610" height="870" fill="#ecfdf3"/>
  <text class="lane-title" x="100" y="230">输入与采集</text>
  <text class="lane-title" x="540" y="230">统一入口</text>
  <text class="lane-title" x="980" y="230">检测与关联</text>
  <text class="lane-title" x="1550" y="230">推理、报告与评测</text>

  <rect class="card" x="105" y="295" width="300" height="145"/>
  <text class="card-title" x="132" y="337">keyevents.json</text>
  <text class="body" x="132" y="375">文件 / 窗口 / 剪贴板</text>
  <text class="body" x="132" y="407">进程 / 浏览器访问</text>

  <rect class="card" x="105" y="520" width="300" height="145"/>
  <text class="card-title" x="132" y="562">录屏视频</text>
  <text class="body" x="132" y="600">mp4 / mov</text>
  <text class="body" x="132" y="632">用于 UI 完成态复核</text>

  <rect class="card" x="105" y="745" width="300" height="145"/>
  <text class="card-title" x="132" y="787">策略配置</text>
  <text class="body" x="132" y="825">敏感词 / 敏感文件</text>
  <text class="body" x="132" y="857">黑白名单 / gate 参数</text>

  <rect class="card" x="545" y="325" width="300" height="160"/>
  <text class="card-title" x="572" y="367">main/run_e2e.py</text>
  <text class="body" x="572" y="405">E2E 编排</text>
  <text class="body" x="572" y="437">加载日志、视频和 .env</text>

  <rect class="card" x="545" y="665" width="300" height="160"/>
  <text class="card-title" x="572" y="707">data_leak_detector</text>
  <text class="body" x="572" y="745">稳定包入口</text>
  <text class="body" x="572" y="777">隔离历史实现目录</text>

  <rect class="warn" x="990" y="260" width="420" height="155"/>
  <text class="card-title" x="1020" y="302">FrameAnalyzer / RiskHunter</text>
  <text class="body" x="1020" y="340">LogFirstDetector</text>
  <text class="body" x="1020" y="372">VLM fallback、抽帧、OCR/VLM</text>

  <rect class="warn" x="990" y="505" width="420" height="155"/>
  <text class="card-title" x="1020" y="547">EventCorrelator</text>
  <text class="body" x="1020" y="585">日志归一化、前台应用分类</text>
  <text class="body" x="1020" y="617">lineage、UploadCandidate</text>

  <rect class="warn" x="990" y="750" width="420" height="155"/>
  <text class="card-title" x="1020" y="792">LeakReasoner</text>
  <text class="body" x="1020" y="830">Datalog facts</text>
  <text class="body" x="1020" y="862">Souffle 或 Python fallback</text>

  <rect class="out" x="1570" y="270" width="470" height="155"/>
  <text class="card-title" x="1600" y="312">full_evidence_*.json</text>
  <text class="body" x="1600" y="350">CorrelationBundle、frame segments</text>
  <text class="body" x="1600" y="382">Datalog facts、leak paths</text>

  <rect class="out" x="1570" y="535" width="470" height="155"/>
  <text class="card-title" x="1600" y="577">NAS benchmark 输出</text>
  <text class="body" x="1600" y="615">triage / deterministic / final</text>
  <text class="body" x="1600" y="647">逐 case 日志与 summary JSON</text>

  <rect class="card" x="1570" y="800" width="470" height="155"/>
  <text class="card-title" x="1600" y="842">报告文档与图</text>
  <text class="body" x="1600" y="880">spec/reports</text>
  <text class="body" x="1600" y="912">仅展示当前代码可支撑内容</text>

  <path class="edge" marker-end="url(#arrow)" d="M405 368 C465 368 485 405 545 405"/>
  <path class="edge" marker-end="url(#arrow)" d="M405 592 C640 592 840 337 990 337"/>
  <path class="edge" marker-end="url(#arrow)" d="M405 817 C465 817 485 745 545 745"/>
  <path class="edge" marker-end="url(#arrow)" d="M845 405 C900 405 935 337 990 337"/>
  <path class="edge" marker-end="url(#arrow)" d="M845 745 C910 745 935 582 990 582"/>
  <path class="edge" marker-end="url(#arrow)" d="M1200 415 L1200 505"/>
  <path class="edge" marker-end="url(#arrow)" d="M1200 660 L1200 750"/>
  <path class="edge" marker-end="url(#arrow)" d="M1410 582 C1490 582 1490 347 1570 347"/>
  <path class="edge" marker-end="url(#arrow)" d="M1410 827 C1490 827 1490 347 1570 347"/>
  <path class="edge" marker-end="url(#arrow)" d="M1805 425 L1805 535"/>
  <path class="edge" marker-end="url(#arrow)" d="M1805 690 L1805 800"/>

  <path class="dash" marker-end="url(#arrow-muted)" d="M2040 612 C2130 612 2130 1120 1170 1120 C820 1120 820 865 990 827"/>
  <text class="small" x="1020" y="1100">评测失败样例回流到 log-first 规则、VLM gate、抽帧参数、OCR gate 和完成态 prompt</text>

  <text class="small" x="70" y="1210">说明：本图不再展示旧报告中的过期指标；当前指标以 spec/output/nas_vlm_*.json 的 summary 为准。</text>
</svg>
