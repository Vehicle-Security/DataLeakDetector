<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1280" viewBox="0 0 2200 1280">
  <defs>
    <style>
      .title { font: 700 54px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102033; }
      .subtitle { font: 28px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #52616f; }
      .card-title { font: 700 25px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102033; }
      .body { font: 22px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #203246; }
      .small { font: 19px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #52616f; }
      .label { font: 700 19px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #334155; }
      .card { fill: #ffffff; stroke: #8ea3ba; stroke-width: 2.6; rx: 18; }
      .decision { fill: #fff7d6; stroke: #f59e0b; stroke-width: 3; rx: 18; }
      .local { fill: #dcfce7; stroke: #22c55e; stroke-width: 3; rx: 18; }
      .remote { fill: #ede9fe; stroke: #a78bfa; stroke-width: 3; rx: 18; }
      .skip { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2.6; rx: 18; }
      .final { fill: #e0f7ff; stroke: #38bdf8; stroke-width: 3; rx: 20; }
      .edge { stroke: #4b5f76; stroke-width: 4.6; fill: none; }
      .thin { stroke: #64748b; stroke-width: 3.4; fill: none; stroke-dasharray: 10 8; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5f76"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="2200" height="1280" fill="#ffffff"/>
  <text class="title" x="70" y="82">VLM 复核门控流程</text>
  <text class="subtitle" x="74" y="126">当前实现：先确定性日志判断，再 local feature gate，最后才进入 OCR / remote VLM 复核</text>

  <!-- Main path -->
  <rect class="card" x="90" y="265" width="280" height="140"/>
  <text class="card-title" x="120" y="307">NAS case</text>
  <text class="body" x="120" y="345">logs + video</text>
  <text class="body" x="120" y="377">groundtruth 仅用于评测</text>

  <rect class="card" x="460" y="265" width="330" height="140"/>
  <text class="card-title" x="490" y="307">LogFirstDetector</text>
  <text class="body" x="490" y="345">upload_events</text>
  <text class="body" x="490" y="377">file mappings / fallback meta</text>

  <rect class="decision" x="880" y="265" width="300" height="140"/>
  <text class="card-title" x="925" y="318">deterministic</text>
  <text class="card-title" x="962" y="352">positive?</text>

  <rect class="card" x="1270" y="265" width="330" height="140"/>
  <text class="card-title" x="1300" y="307">Fallback builder</text>
  <text class="body" x="1300" y="345">should_run_vlm</text>
  <text class="body" x="1300" y="377">reasons / windows / candidates</text>

  <rect class="decision" x="1690" y="265" width="300" height="140"/>
  <text class="card-title" x="1740" y="318">should run</text>
  <text class="card-title" x="1776" y="352">VLM?</text>

  <path class="edge" marker-end="url(#arrow)" d="M370 335 L460 335"/>
  <path class="edge" marker-end="url(#arrow)" d="M790 335 L880 335"/>
  <path class="edge" marker-end="url(#arrow)" d="M1180 335 L1270 335"/>
  <path class="edge" marker-end="url(#arrow)" d="M1600 335 L1690 335"/>

  <!-- Deterministic yes branch -->
  <rect class="local" x="880" y="500" width="300" height="130"/>
  <text class="card-title" x="915" y="542">log positive</text>
  <text class="body" x="915" y="580">frames_sent=0</text>
  <text class="body" x="915" y="610">不进入 live VLM</text>
  <path class="edge" marker-end="url(#arrow)" d="M1030 405 L1030 500"/>
  <text class="label" x="1044" y="462">是</text>

  <!-- should_run no branch -->
  <rect class="skip" x="1690" y="500" width="300" height="130"/>
  <text class="card-title" x="1735" y="542">skip VLM</text>
  <text class="body" x="1735" y="580">无敏感上下文</text>
  <text class="body" x="1735" y="610">或纯噪声样例</text>
  <path class="edge" marker-end="url(#arrow)" d="M1840 405 L1840 500"/>
  <text class="label" x="1854" y="462">否</text>

  <!-- Review path -->
  <rect class="card" x="90" y="760" width="320" height="145"/>
  <text class="card-title" x="120" y="802">Local feature gate</text>
  <text class="body" x="120" y="840">all / strict / adaptive / aggressive</text>
  <text class="body" x="120" y="872">强本地证据短路</text>

  <rect class="decision" x="500" y="760" width="280" height="145"/>
  <text class="card-title" x="535" y="815">local</text>
  <text class="card-title" x="532" y="849">positive?</text>

  <rect class="remote" x="870" y="760" width="330" height="145"/>
  <text class="card-title" x="900" y="802">Remote review queue</text>
  <text class="body" x="900" y="840">adaptive frame budget</text>
  <text class="body" x="900" y="872">抽帧 + OCR + image_sent</text>

  <rect class="decision" x="1290" y="760" width="280" height="145"/>
  <text class="card-title" x="1326" y="815">local OCR</text>
  <text class="card-title" x="1360" y="849">hit?</text>

  <rect class="remote" x="1660" y="760" width="330" height="145"/>
  <text class="card-title" x="1690" y="802">Remote VLM</text>
  <text class="body" x="1690" y="840">image_sent=true 帧带原图</text>
  <text class="body" x="1690" y="872">text-only 帧补时间线</text>

  <path class="edge" marker-end="url(#arrow)" d="M1840 405 C1840 690 250 690 250 760"/>
  <text class="label" x="1645" y="690">是，进入复核路径</text>
  <path class="edge" marker-end="url(#arrow)" d="M410 832 L500 832"/>
  <path class="edge" marker-end="url(#arrow)" d="M780 832 L870 832"/>
  <path class="edge" marker-end="url(#arrow)" d="M1200 832 L1290 832"/>
  <path class="edge" marker-end="url(#arrow)" d="M1570 832 L1660 832"/>
  <text class="label" x="804" y="812">否</text>
  <text class="label" x="1592" y="812">否</text>

  <rect class="local" x="500" y="1010" width="280" height="120"/>
  <text class="card-title" x="530" y="1052">local_positive</text>
  <text class="body" x="530" y="1090">model=local_vlm_gate</text>
  <path class="edge" marker-end="url(#arrow)" d="M640 905 L640 1010"/>
  <text class="label" x="654" y="962">是</text>

  <rect class="local" x="1290" y="1010" width="280" height="120"/>
  <text class="card-title" x="1315" y="1052">local_ocr_positive</text>
  <text class="body" x="1315" y="1090">完成态 + 敏感名</text>
  <path class="edge" marker-end="url(#arrow)" d="M1430 905 L1430 1010"/>
  <text class="label" x="1444" y="962">是</text>

  <!-- Final bucket -->
  <rect class="final" x="760" y="1165" width="700" height="85"/>
  <text class="card-title" x="790" y="1217">最终分桶：</text>
  <text class="body" x="940" y="1217">triage / deterministic / final -> TP / FP / TN / FN</text>

  <path class="edge" marker-end="url(#arrow)" d="M1030 630 C1030 760 1110 1090 1110 1165"/>
  <path class="edge" marker-end="url(#arrow)" d="M1840 630 C1840 1110 1280 1138 1230 1165"/>
  <path class="edge" marker-end="url(#arrow)" d="M640 1130 C710 1160 740 1165 760 1198"/>
  <path class="edge" marker-end="url(#arrow)" d="M1430 1130 C1360 1160 1320 1165 1290 1198"/>
  <path class="edge" marker-end="url(#arrow)" d="M1825 905 C1825 1125 1450 1135 1370 1165"/>

  <path class="thin" marker-end="url(#arrow-muted)" d="M1460 1208 C1740 1208 2020 1120 2020 832"/>
  <text class="small" x="1500" y="1238">FN / FP 回流：调整 fallback、feature gate、OCR gate、抽帧参数和 prompt</text>
</svg>
