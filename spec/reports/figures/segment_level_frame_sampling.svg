<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500">
  <defs>
    <style>
      .title { font: 700 56px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102033; }
      .subtitle { font: 28px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #52616f; }
      .card-title { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102033; }
      .body { font: 25px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #203246; }
      .small { font: 21px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #52616f; }
      .mono { font: 700 22px Consolas, "Microsoft YaHei", monospace; fill: #334155; }
      .card { fill: #ffffff; stroke: #8ea3ba; stroke-width: 3; rx: 22; }
      .blue { fill: #eff6ff; }
      .yellow { fill: #fff7d6; }
      .green { fill: #ecfdf3; }
      .purple { fill: #f5f3ff; }
      .red { fill: #fff1f2; }
      .edge { stroke: #4b5f76; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 4; fill: none; stroke-dasharray: 14 10; marker-end: url(#arrow-muted); }
      .timeline { stroke: #334155; stroke-width: 5; }
      .window { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; rx: 12; }
      .segment { fill: #fef3c7; stroke: #f59e0b; stroke-width: 3; rx: 10; }
      .kept { fill: #dcfce7; stroke: #16a34a; stroke-width: 4; rx: 10; }
      .frame { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2.5; rx: 9; }
      .anchor { fill: #fee2e2; stroke: #ef4444; stroke-width: 3; rx: 9; }
      .selected { fill: #dcfce7; stroke: #16a34a; stroke-width: 3; rx: 9; }
      .label { font: 700 21px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5f76"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="2400" height="1500" fill="#ffffff"/>
  <text class="title" x="80" y="92">当前抽帧算法：先定位片段，再逐段观察</text>
  <text class="subtitle" x="84" y="142">适合小时级录屏：不扫全视频，不做整段均匀抽帧，只让 VLM 看日志筛出的高信号片段。</text>

  <g filter="url(#shadow)">
    <rect class="card blue" x="85" y="235" width="390" height="205"/>
    <text class="card-title" x="125" y="292">完整录屏</text>
    <text class="body" x="125" y="340">可能是一小时或更长</text>
    <text class="body" x="125" y="378">直接均匀抽帧容易漏短暂状态</text>

    <rect class="card yellow" x="565" y="235" width="390" height="205"/>
    <text class="card-title" x="605" y="292">日志先缩小范围</text>
    <text class="body" x="605" y="340">敏感文件、粘贴、上传、发送</text>
    <text class="body" x="605" y="378">外部应用、会议、网盘、AI</text>

    <rect class="card green" x="1045" y="235" width="390" height="205"/>
    <text class="card-title" x="1085" y="292">只保留高信号片段</text>
    <text class="body" x="1085" y="340">窗口合并后切成短片段</text>
    <text class="body" x="1085" y="378">按事件和关键词打分排序</text>

    <rect class="card purple" x="1525" y="235" width="390" height="205"/>
    <text class="card-title" x="1565" y="292">每段抽少量关键帧</text>
    <text class="body" x="1565" y="340">动作锚点 + 片段边界</text>
    <text class="body" x="1565" y="378">再补画面变化大的帧</text>

    <rect class="card red" x="2005" y="235" width="310" height="205"/>
    <text class="card-title" x="2045" y="292">合并动作事实</text>
    <text class="body" x="2045" y="340">每段输出观察</text>
    <text class="body" x="2045" y="378">Datalog 拼完整链</text>
  </g>

  <path class="edge" d="M 475 338 L 565 338"/>
  <path class="edge" d="M 955 338 L 1045 338"/>
  <path class="edge" d="M 1435 338 L 1525 338"/>
  <path class="edge" d="M 1915 338 L 2005 338"/>

  <text class="card-title" x="95" y="575">核心直觉</text>
  <line class="timeline" x1="145" y1="690" x2="2255" y2="690"/>
  <text class="small" x="145" y="650">小时级视频时间线</text>
  <text class="small" x="2160" y="650">时间</text>

  <rect class="window" x="390" y="655" width="260" height="70"/>
  <rect class="window" x="980" y="655" width="360" height="70"/>
  <rect class="window" x="1720" y="655" width="300" height="70"/>
  <text class="label" x="420" y="705">日志圈出的可疑窗口</text>
  <text class="label" x="1042" y="705">候选窗口</text>
  <text class="label" x="1760" y="705">候选窗口</text>

  <path class="dash" d="M 520 725 C 520 785, 520 815, 520 865"/>
  <path class="dash" d="M 1160 725 C 1160 785, 1160 815, 1160 865"/>
  <path class="dash" d="M 1870 725 C 1870 785, 1870 815, 1870 865"/>

  <g filter="url(#shadow)">
    <rect class="card" x="130" y="865" width="640" height="260"/>
    <text class="card-title" x="170" y="925">片段层</text>
    <text class="body" x="170" y="970">窗口被切成约 45 秒片段，相邻片段有重叠，避免关键状态卡在边界。</text>
    <rect class="segment" x="185" y="1030" width="135" height="48"/>
    <rect class="segment" x="300" y="1030" width="135" height="48" opacity="0.82"/>
    <rect class="kept" x="415" y="1030" width="135" height="48"/>
    <rect class="segment" x="530" y="1030" width="135" height="48" opacity="0.62"/>
    <text class="small" x="185" y="1108">重叠切片，按信号分只保留最值得看的段</text>

    <rect class="card" x="880" y="865" width="640" height="260"/>
    <text class="card-title" x="920" y="925">帧选择层</text>
    <text class="body" x="920" y="970">每个保留片段先找候选点，再选最多 4 帧作为 VLM 上下文。</text>
    <rect class="anchor" x="950" y="1030" width="60" height="48"/>
    <rect class="frame" x="1030" y="1030" width="60" height="48"/>
    <rect class="selected" x="1110" y="1030" width="60" height="48"/>
    <rect class="frame" x="1190" y="1030" width="60" height="48"/>
    <rect class="selected" x="1270" y="1030" width="60" height="48"/>
    <rect class="anchor" x="1350" y="1030" width="60" height="48"/>
    <text class="small" x="950" y="1108">红色：动作附近；绿色：最终入选；灰色：候选但未发送</text>

    <rect class="card" x="1630" y="865" width="640" height="260"/>
    <text class="card-title" x="1670" y="925">推理层</text>
    <text class="body" x="1670" y="970">VLM 不给整个 case 一个笼统结论，而是逐段输出看到的动作。</text>
    <text class="mono" x="1670" y="1035">段1：打开敏感文件</text>
    <text class="mono" x="1670" y="1072">段2：另存 / 压缩</text>
    <text class="mono" x="1670" y="1109">段3：上传完成</text>
  </g>

  <path class="edge" d="M 770 995 L 880 995"/>
  <path class="edge" d="M 1520 995 L 1630 995"/>

  <g>
    <rect class="card green" x="150" y="1245" width="620" height="120"/>
    <text class="card-title" x="190" y="1293">预算含义</text>
    <text class="body" x="190" y="1335">推荐 24 帧：大约最多看 6 个高信号片段，每段最多 4 帧。</text>

    <rect class="card yellow" x="890" y="1245" width="620" height="120"/>
    <text class="card-title" x="930" y="1293">关键取舍</text>
    <text class="body" x="930" y="1335">长视频优先增加片段覆盖，而不是把单个片段看得更密。</text>

    <rect class="card purple" x="1630" y="1245" width="620" height="120"/>
    <text class="card-title" x="1670" y="1293">审计输出</text>
    <text class="body" x="1670" y="1335">保留片段编号、证据帧、时间范围和 observed actions。</text>
  </g>

  <text class="small" x="80" y="1450">图示文件：segment_level_frame_sampling.svg。核心目标：把小时级视频压缩成少数高价值视觉观察，而不是让 VLM 盲看整段视频。</text>
</svg>
