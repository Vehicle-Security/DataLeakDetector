# 敏感文件关键词（文件名包含这些词则视为敏感）
sensitive_keywords:
  # 中文关键词
  - "机密"
  - "绝密"
  - "内部"
  - "秘密"
  - "合同"
  - "协议"
  - "发票"
  - "工资"
  - "薪酬"
  - "战略"
  - "规划"
  - "预算"
  - "财务"
  - "报表"
  - "员工"
  - "人事"
  - "简历"
  - "密码"
  - "专利"
  - "算法"
  - "核心"
  - "会议纪要"
  - "会议记录"
  - "客户"
  - "名单"
  # 英文关键词
  - "confidential"
  - "secret"
  - "private"
  - "salary"
  - "contract"
  - "budget"
  - "finance"
  - "resume"
  - "password"
  - "key"
  - "token"
  - "accesskey"
  - "credential"
  - "patent"
  - "algorithm"
  - "meeting"
  - "customer"
  - "client"

# 敏感文件扩展名
sensitive_extensions:
  # 文档类
  - ".doc"
  - ".docx"
  - ".xls"
  - ".xlsx"
  - ".ppt"
  - ".pptx"
  - ".pdf"
  - ".txt"
  - ".csv"
  - ".json"
  - ".xml"
  # 压缩包
  - ".zip"
  - ".rar"
  - ".7z"
  - ".tar"
  - ".gz"
  # 多媒体
  - ".mp3"
  - ".mp4"
  - ".wav"
  - ".avi"
  - ".mov"
  # 图片
  - ".jpg"
  - ".jpeg"
  - ".png"
  - ".gif"
  - ".bmp"
  # 密钥/证书
  - ".pem"
  - ".key"
  - ".crt"
  - ".cer"
  - ".p12"
  # 代码
  - ".py"
  - ".java"
  - ".cpp"
  - ".c"
  - ".h"
  - ".go"
  - ".rs"

# 系统白名单配置（用于过滤误报）
system_whitelist:
  # 需要忽略的系统进程（纯后台守护进程）
  # 注意：filecoordinationd 和 quicklookd 保留用于关联分析
  ignore_processes:
    - cfprefsd        # 配置服务
    - BiomeAgent      # 生物特征代理
    - analyticsd      # 分析服务
    - cloudd          # iCloud 同步
    - nsurlsessiond   # 网络会话（系统级）
    - trustd          # 证书信任
    - symptomsd       # 系统症状
    - logd            # 日志服务
    - syslogd         # 系统日志
    - configd         # 配置守护
    - diskarbitrationd # 磁盘仲裁
    - coreduetd       # 核心预测
    - contextstored   # 上下文存储
    - powerd          # 电源管理
    - timed           # 时间服务
    - locationd       # 位置服务
    - tccd            # 透明度同意控制
    - sharingd        # 系统级共享
    - rapportd        # 设备连接
    - suggestd        # Siri 建议
    - remindd         # 提醒事项
    - CalendarAgent   # 日历代理
    - AddressBookSourceSync # 通讯录同步
    - mdworker        # Spotlight 索引
    - mds             # 元数据服务
    - mds_stores      # 元数据存储
    - notifyd         # 通知守护
    - bird            # iCloud 同步
    - kernel_task     # 内核任务
    - spotlight       # Spotlight
    - coreaudiod      # 音频服务
    - bluetoothd      # 蓝牙服务
    - WindowServer    # 窗口服务
  
  # 需要忽略的路径前缀
  ignore_path_prefixes:
    - /dev/
    - /sys
    - /private/var/
    - /private/tmp/
    - /bin/
    - /usr/
    - /sbin/
    - /System/
    - /System/Library/
    - /tmp/
    - /opt/
    - /Library/
    - /Applications/
    - /.DocumentRevisions-V100/
    - /.Spotlight-V100/
    - /.fseventsd/
    - /Volumes/
  
  # 需要保留用于关联分析的进程
  # 这些进程会读取用户文件，需要与前台应用关联
  correlation_processes:
    - filecoordinationd  # 文件协调服务
    - quicklookd         # 快速预览
    - QuickLookSatellite # 快速预览卫星进程
