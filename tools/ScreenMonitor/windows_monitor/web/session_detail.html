<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session详情 - 文件监控录制系统</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>
    <div class="container wide">
        <header>
            <a href="/sessions" class="back-link">← 返回列表</a>
            <h1 id="sessionTitle">Session详情</h1>
        </header>

        <main>
            <!-- 视频播放区 -->
            <section class="video-section">
                <h2>📹 录制视频</h2>
                <div id="videoContainer">
                    <video id="sessionVideo" controls>
                        <source src="" type="video/mp4">
                        您的浏览器不支持视频播放
                    </video>
                </div>
            </section>

            <!-- 事件筛选栏 -->
            <section class="filter-section">
                <h2>🔍 事件筛选</h2>
                <div class="filters">
                    <select id="appFilter">
                        <option value="">所有应用</option>
                    </select>
                    <select id="fileTypeFilter">
                        <option value="">所有文件类型</option>
                    </select>
                    <input type="text" id="searchQuery" placeholder="搜索文件名...">
                </div>
            </section>

            <!-- 事件时间线 -->
            <section class="timeline-section">
                <div class="section-header">
                    <h2>⏱️ 事件时间线</h2>
                    <div class="stats">
                        <span class="badge">总事件: <strong id="totalEvents">0</strong></span>
                        <span class="badge">已筛选: <strong id="filteredEvents">0</strong></span>
                    </div>
                </div>

                <div id="eventsTimeline" class="events-timeline">
                    <div class="loading">加载中...</div>
                </div>
            </section>

            <!-- 操作按钮 -->
            <section class="actions-section">
                <button id="downloadEvents" class="btn btn-secondary">📥 导出JSON</button>
                <button id="downloadVideo" class="btn btn-secondary">📹 下载视频</button>
            </section>
        </main>
    </div>

    <script src="../static/js/session.js"></script>
</body>

</html>
