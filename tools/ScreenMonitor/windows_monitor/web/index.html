<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件监控录制系统</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>🎬 文件监控录制系统</h1>
            <p class="subtitle">实时监控文件操作，检测数据泄露风险</p>
        </header>

        <main>
            <!-- 录制控制面板 -->
            <section class="control-panel">
                <h2>录制控制</h2>
                <div class="controls">
                    <div class="button-group">
                        <button id="startBtn" class="btn btn-primary">🔴 开始录制</button>
                        <button id="stopBtn" class="btn btn-danger" disabled>⏹️ 停止录制</button>
                    </div>
                    <p class="info-text">点击"开始录制"后，录制将持续进行，直到您点击"停止录制"</p>
                </div>

                <!-- 录制状态显示 -->
                <div id="recordingStatus" class="status-panel" style="display: none;">
                    <div class="status-indicator recording"></div>
                    <div class="status-info">
                        <p><strong>Session ID:</strong> <span id="currentSessionId"></span></p>
                        <p><strong>已录制:</strong> <span id="elapsedTime">0</span> 秒</p>
                    </div>
                </div>
            </section>

            <!-- 最近的录制会话 -->
            <section class="sessions-section">
                <div class="section-header">
                    <h2>📊 最近的录制会话</h2>
                    <a href="/sessions" class="btn btn-link">查看全部 →</a>
                </div>
                <div id="recentSessions" class="sessions-grid">
                    <div class="loading">加载中...</div>
                </div>
            </section>
        </main>

        <footer>
            <p>文件监控录制系统 v3.0 | 系统运行正常</p>
        </footer>
    </div>

    <script src="static/js/main.js"></script>
</body>

</html>
