<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win Monitor - 数据泄露行为监控系统</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --bg-card: #161b22;
            --bg-hover: #1f2937;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-purple: #a78bfa;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-yellow: #d29922;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg-dark) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px;
            text-align: center;
            margin-bottom: 32px;
        }

        .hero h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        .hero p {
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .btn-group {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 16px 32px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-start {
            background: linear-gradient(135deg, var(--accent-green), #22c55e);
            color: #000;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.2);
        }

        .btn-stop {
            background: var(--accent-red);
            color: #fff;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .status-badge.idle {
            background: rgba(139, 148, 158, 0.2);
            color: var(--text-secondary);
        }

        .status-badge.monitoring {
            background: rgba(63, 185, 80, 0.2);
            color: var(--accent-green);
        }

        .status-badge.recording {
            background: rgba(248, 81, 73, 0.2);
            color: var(--accent-red);
        }

        .pulse {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .pulse.green {
            background: var(--accent-green);
        }

        .pulse.red {
            background: var(--accent-red);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }
        }

        /* Section Header */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-header h2 {
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-header a {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .section-header a:hover {
            text-decoration: underline;
        }

        /* Sessions Table */
        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: rgba(0, 0, 0, 0.3);
        }

        th,
        td {
            padding: 16px;
            text-align: left;
        }

        th {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.85rem;
        }

        tbody tr {
            border-top: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: var(--bg-hover);
        }

        .session-id {
            font-family: 'SF Mono', Monaco, monospace;
            color: var(--accent-blue);
            font-size: 0.9rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .badge-risk {
            background: rgba(248, 81, 73, 0.2);
            color: var(--accent-red);
            border: 1px solid rgba(248, 81, 73, 0.3);
        }

        .badge-safe {
            background: rgba(63, 185, 80, 0.2);
            color: var(--accent-green);
            border: 1px solid rgba(63, 185, 80, 0.3);
        }

        .status-text {
            color: var(--text-secondary);
        }

        .status-text.recording {
            color: var(--accent-yellow);
        }

        .arrow {
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        /* Log Console */
        .log-console {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-top: 24px;
        }

        .log-console h3 {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .log-list {
            background: var(--bg-dark);
            border-radius: 8px;
            padding: 12px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 0.8rem;
        }

        .log-entry {
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        .log-time {
            color: var(--text-secondary);
        }

        .log-level {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .log-level.info {
            background: var(--accent-blue);
            color: #fff;
        }

        .log-level.alert {
            background: var(--accent-red);
            color: #fff;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        /* Nav */
        nav {
            display: flex;
            gap: 24px;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            padding: 8px 0;
            border-bottom: 2px solid transparent;
        }

        nav a:hover,
        nav a.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent-blue);
        }
    </style>
</head>

<body>
    <nav>
        <a href="/" class="active">🏠 控制面板</a>
        <a href="/sessions">📋 会话列表</a>
    </nav>

    <div class="container">
        <!-- Hero Section -->
        <div class="hero">
            <h1>🖥️ Windows 数据泄露行为监控系统</h1>
            <p>实时监控敏感文件操作、应用切换、数据外发行为</p>

            <div class="btn-group">
                <button class="btn btn-start" id="startBtn" onclick="startMonitor()">
                    ▶️ 开始监控
                </button>
                <button class="btn btn-stop" id="stopBtn" onclick="stopMonitor()" disabled>
                    ⏹️ 停止监控
                </button>
            </div>

            <div class="status-badge idle" id="statusBadge">
                <span class="pulse"></span>
                <span id="statusText">系统空闲</span>
            </div>
        </div>

        <!-- Recent Sessions -->
        <div class="section-header">
            <h2>⏱️ 最近的监控会话</h2>
            <a href="/sessions">查看全部 →</a>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>会话 ID</th>
                        <th>开始时间</th>
                        <th>时长</th>
                        <th>风险事件</th>
                        <th>状态</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="sessionsTable">
                    <tr>
                        <td colspan="6" class="empty">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Live Log Console -->
        <div class="log-console">
            <h3>📋 实时日志</h3>
            <div class="log-list" id="logList">
                <div class="empty">暂无日志</div>
            </div>
        </div>
    </div>

    <script>
        let isRunning = false;

        // Fetch status periodically
        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                updateStatusUI(data);
            } catch (e) { console.error(e); }
        }

        function updateStatusUI(data) {
            isRunning = data.is_running;
            const badge = document.getElementById('statusBadge');
            const text = document.getElementById('statusText');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');

            badge.className = 'status-badge';
            const pulse = badge.querySelector('.pulse');
            pulse.className = 'pulse';

            if (!isRunning) {
                badge.classList.add('idle');
                text.textContent = '系统空闲';
            } else if (data.state === 'recording') {
                badge.classList.add('recording');
                pulse.classList.add('red');
                text.textContent = '🎬 录制中';
            } else {
                badge.classList.add('monitoring');
                pulse.classList.add('green');
                text.textContent = '👁️ 监控中';
            }

            startBtn.disabled = isRunning;
            stopBtn.disabled = !isRunning;
        }

        async function startMonitor() {
            await fetch('/api/start', { method: 'POST' });
            fetchStatus();
        }

        async function stopMonitor() {
            await fetch('/api/stop', { method: 'POST' });
            fetchStatus();
        }

        // Fetch sessions
        async function fetchSessions() {
            try {
                const res = await fetch('/api/sessions');
                const data = await res.json();
                renderSessions(data.sessions || []);
            } catch (e) {
                document.getElementById('sessionsTable').innerHTML =
                    '<tr><td colspan="6" class="empty">加载失败</td></tr>';
            }
        }

        function renderSessions(sessions) {
            const tbody = document.getElementById('sessionsTable');
            if (sessions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty">暂无会话记录</td></tr>';
                return;
            }

            tbody.innerHTML = sessions.slice(0, 10).map(s => `
                <tr onclick="window.location='/session/${s.id}'">
                    <td class="session-id">${s.id}</td>
                    <td>${s.start_time || '-'}</td>
                    <td>${formatDuration(s.duration)}</td>
                    <td>
                        ${s.risk_events > 0
                    ? `<span class="badge badge-risk">⚠️ ${s.risk_events}</span>`
                    : '<span class="badge badge-safe">✓ Safe</span>'}
                    </td>
                    <td class="status-text ${s.status === 'recording' ? 'recording' : ''}">
                        ${s.status === 'recording' ? '● 录制中' : '已完成'}
                    </td>
                    <td class="arrow">›</td>
                </tr>
            `).join('');
        }

        function formatDuration(sec) {
            if (!sec) return '-';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return m > 0 ? `${m}m ${s}s` : `${s}s`;
        }

        // Fetch logs
        async function fetchLogs() {
            try {
                const res = await fetch('/api/logs?count=20');
                const data = await res.json();
                renderLogs(data.logs || []);
            } catch (e) { console.error(e); }
        }

        function renderLogs(logs) {
            const list = document.getElementById('logList');
            if (logs.length === 0) {
                list.innerHTML = '<div class="empty">暂无日志</div>';
                return;
            }
            list.innerHTML = logs.slice().reverse().map(log => `
                <div class="log-entry">
                    <span class="log-time">${log.timestamp}</span>
                    <span class="log-level ${log.level}">${log.level.toUpperCase()}</span>
                    <span>${log.message}</span>
                </div>
            `).join('');
        }

        // Init
        fetchStatus();
        fetchSessions();
        fetchLogs();
        setInterval(fetchStatus, 1000);
        setInterval(fetchSessions, 5000);
        setInterval(fetchLogs, 2000);
    </script>
</body>

</html>
