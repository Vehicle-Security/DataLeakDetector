[package]
name = "unified_log_monitor"
version = "0.1.0"
edition = "2021"

# Break out of any parent workspace
[workspace]

[dependencies]
macos-unifiedlogs = { path = "../../" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
log = "0.4"
simplelog = "0.12"
clap = { version = "4.0", features = ["derive"] }
regex = "1.10"
ctrlc = "3.4"
