# 敏感文件关键词（文件名包含这些词则视为敏感）
sensitive_keywords:
  # 中文关键词
  - "机密"
  - "绝密"
  - "内部"
  - "秘密"
  - "合同"
  - "协议"
  - "发票"
  - "工资"
  - "薪酬"
  - "战略"
  - "规划"
  - "预算"
  - "财务"
  - "报表"
  - "员工"
  - "人事"
  - "简历"
  - "密码"
  - "专利"
  - "算法"
  - "核心"
  - "会议纪要"
  - "会议记录"
  - "客户"
  - "名单"
  # 英文关键词
  - "confidential"
  - "secret"
  - "private"
  - "salary"
  - "contract"
  - "budget"
  - "finance"
  - "resume"
  - "password"
  - "key"
  - "token"
  - "accesskey"
  - "credential"
  - "patent"
  - "algorithm"
  - "meeting"
  - "customer"
  - "client"

# 敏感文件扩展名
sensitive_extensions:
  # 文档类
  - ".doc"
  - ".docx"
  - ".xls"
  - ".xlsx"
  - ".ppt"
  - ".pptx"
  - ".pdf"
  - ".txt"
  - ".csv"
  - ".json"
  - ".xml"
  # 压缩包
  - ".zip"
  - ".rar"
  - ".7z"
  - ".tar"
  - ".gz"
  # 多媒体
  - ".mp3"
  - ".mp4"
  - ".wav"
  - ".avi"
  - ".mov"
  # 图片
  - ".jpg"
  - ".jpeg"
  - ".png"
  - ".gif"
  - ".bmp"
  # 密钥/证书
  - ".pem"
  - ".key"
  - ".crt"
  - ".cer"
  - ".p12"
  # 代码
  - ".py"
  - ".java"
  - ".cpp"
  - ".c"
  - ".h"
  - ".go"
  - ".rs"

# 系统白名单配置（用于过滤误报）- Windows 版本
system_whitelist:
  # 需要忽略的系统进程
  ignore_processes:
    - svchost
    - csrss
    - wininit
    - services
    - lsass
    - smss
    - dwm
    - explorer
    - RuntimeBroker
    - SearchHost
    - StartMenuExperienceHost
    - ShellExperienceHost
    - sihost
    - taskhostw
    - ctfmon
    - conhost
    - fontdrvhost
    - WmiPrvSE
    - dllhost
    - audiodg
    - spoolsv
    - SearchIndexer
    - SecurityHealthService
    - MsMpEng
    - NisSrv
  
  # 需要忽略的路径前缀
  ignore_path_prefixes:
    - "C:\\Windows\\"
    - "C:\\Program Files\\"
    - "C:\\Program Files (x86)\\"
    - "C:\\ProgramData\\"
    - "C:\\$Recycle.Bin\\"
    - "\\AppData\\Local\\Temp\\"
    - "\\AppData\\Local\\Microsoft\\"
    - "\\AppData\\Roaming\\Microsoft\\"
    - "\\AppData\\Local\\Google\\Chrome\\User Data\\"
    - "\\AppData\\Local\\Microsoft\\Edge\\User Data\\"
    - "\\.git\\"
    - "\\.idea\\"
    - "\\__pycache__\\"
    - "\\node_modules\\"
    - "\\.vscode\\"
  
  # 需要保留用于关联分析的进程
  correlation_processes:
    - explorer  # 文件资源管理器

# 监控设置
monitor_settings:
  poll_interval_ms: 500  # 窗口检查间隔（毫秒）
  buffer_time_seconds: 5  # 风险消失后继续录制的缓冲时间
  enable_screen_recording: true
  enable_window_monitoring: true
  enable_file_monitoring: true
