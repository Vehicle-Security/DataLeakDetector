<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session 详情 - Win Monitor</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --bg-card: #161b22;
            --bg-panel: #11141d;
            --bg-hover: #1a1f2e;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-yellow: #d29922;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            height: 60px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .back-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .header-info h1 {
            font-size: 1rem;
            font-weight: 600;
        }

        .header-info h1 span {
            color: var(--accent-blue);
            font-family: monospace;
        }

        .header-info p {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Main Layout */
        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Video Panel */
        .video-panel {
            flex: 2;
            background: #000;
            border-right: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .video-container {
            width: 100%;
            max-height: 100%;
            aspect-ratio: 16/9;
            background: var(--bg-dark);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .no-video {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            height: 100%;
        }

        .no-video .icon {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Logs Panel */
        .logs-panel {
            flex: 1;
            background: var(--bg-panel);
            display: flex;
            flex-direction: column;
            min-width: 400px;
        }

        .search-bar {
            height: 50px;
            border-bottom: 1px solid var(--border);
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-bar .icon {
            color: var(--text-secondary);
        }

        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .search-bar input::placeholder {
            color: var(--text-secondary);
        }

        .search-bar input:focus {
            outline: none;
        }

        .logs-table-container {
            flex: 1;
            overflow-y: auto;
        }

        .logs-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
        }

        .logs-table thead {
            background: var(--bg-hover);
            position: sticky;
            top: 0;
        }

        .logs-table th {
            padding: 12px 16px;
            text-align: left;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .logs-table tbody tr {
            border-bottom: 1px solid rgba(48, 54, 61, 0.5);
            transition: background 0.2s;
        }

        .logs-table tbody tr:hover {
            background: var(--bg-hover);
        }

        .logs-table td {
            padding: 10px 16px;
            vertical-align: top;
        }

        .time-col {
            color: var(--text-secondary);
            font-family: monospace;
            white-space: nowrap;
        }

        .process-col {
            color: var(--accent-blue);
            font-weight: 500;
            white-space: nowrap;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .event-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .event-badge.created {
            background: rgba(63, 185, 80, 0.2);
            color: var(--accent-green);
        }

        .event-badge.modified {
            background: rgba(210, 153, 34, 0.2);
            color: var(--accent-yellow);
        }

        .event-badge.deleted {
            background: rgba(248, 81, 73, 0.2);
            color: var(--accent-red);
        }

        .event-badge.opened {
            background: rgba(88, 166, 255, 0.2);
            color: var(--accent-blue);
        }

        .event-badge.renamed {
            background: rgba(163, 113, 247, 0.2);
            color: #a371f7;
        }

        .file-col {
            color: var(--text-secondary);
            font-family: monospace;
            font-size: 0.7rem;
            word-break: break-all;
        }

        .logs-footer {
            height: 32px;
            border-top: 1px solid var(--border);
            background: var(--bg-card);
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        /* Tabs */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);
        }

        .tab {
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            border-bottom: 2px solid transparent;
        }

        .tab:hover {
            color: var(--text-primary);
        }

        .tab.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent-blue);
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div class="header">
        <button class="back-btn" onclick="history.back()">←</button>
        <div class="header-info">
            <h1>Session <span id="sessionId">-</span></h1>
            <p id="sessionMeta">加载中...</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Video Panel -->
        <div class="video-panel">
            <div class="video-container" id="videoContainer">
                <div class="no-video">
                    <div class="icon">📹</div>
                    <p>加载中...</p>
                </div>
            </div>
        </div>

        <!-- Logs Panel -->
        <div class="logs-panel">
            <div class="tabs">
                <button class="tab active" data-tab="events">📋 关键事件</button>
                <button class="tab" data-tab="logs">📝 完整日志</button>
            </div>

            <div class="search-bar">
                <span class="icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索日志 (进程, 文件, 操作)...">
            </div>

            <div class="logs-table-container">
                <table class="logs-table">
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>进程</th>
                            <th>操作</th>
                            <th>文件路径</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody">
                        <tr>
                            <td colspan="4" class="empty">加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="logs-footer">
                <span id="eventsCount">0 events</span>
                <span>Session Log</span>
            </div>
        </div>
    </div>

    <script>
        const sessionId = window.location.pathname.split('/').pop();
        let allLogs = [];
        let currentTab = 'events';

        document.getElementById('sessionId').textContent = sessionId;

        // Fetch session info
        async function fetchSession() {
            try {
                const res = await fetch(`/api/sessions/${sessionId}`);
                const data = await res.json();

                if (data.success && data.session) {
                    const s = data.session;
                    document.getElementById('sessionMeta').textContent =
                        `${s.start_time} • ${s.duration ? s.duration.toFixed(0) + 's' : '-'}`;

                    // Video
                    if (s.video_path) {
                        document.getElementById('videoContainer').innerHTML =
                            `<video controls src="${s.video_path}"></video>`;
                    } else {
                        document.getElementById('videoContainer').innerHTML =
                            '<div class="no-video"><div class="icon">📹</div><p>未找到录屏文件</p></div>';
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        // Fetch key events
        async function fetchEvents() {
            try {
                const res = await fetch(`/api/sessions/${sessionId}/events`);
                const data = await res.json();
                allLogs = data.events || [];
                renderLogs();
            } catch (e) {
                document.getElementById('logsTableBody').innerHTML =
                    '<tr><td colspan="4" class="empty">加载失败</td></tr>';
            }
        }

        function renderLogs() {
            const tbody = document.getElementById('logsTableBody');
            const search = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allLogs;
            if (search) {
                filtered = allLogs.filter(log =>
                    (log.file_path && log.file_path.toLowerCase().includes(search)) ||
                    (log.process_info?.process_name && log.process_info.process_name.toLowerCase().includes(search)) ||
                    (log.event_type && log.event_type.toLowerCase().includes(search))
                );
            }

            document.getElementById('eventsCount').textContent = `${filtered.length} events`;

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty">没有找到日志</td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map(log => {
                // 对于重命名事件，显示 原路径 -> 新名称
                let filePath = log.file_path || log.file_name || '-';
                if (log.event_type === 'renamed' && log.destination_name) {
                    filePath = `${log.file_name} → ${log.destination_name}`;
                }

                return `
                <tr>
                    <td class="time-col">${formatTime(log.timestamp)}</td>
                    <td class="process-col" title="${log.process_info?.process_name || ''}">${log.process_info?.process_name || 'N/A'}</td>
                    <td><span class="event-badge ${log.event_type}">${log.event_type || 'unknown'}</span></td>
                    <td class="file-col" title="${log.destination_path || log.file_path || ''}">${filePath}</td>
                </tr>
            `}).join('');
        }

        function formatTime(ts) {
            try {
                return new Date(ts).toLocaleTimeString('zh-CN', { hour12: false });
            } catch (e) {
                return ts;
            }
        }

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                fetchEvents(); // Reload with different endpoint if needed
            });
        });

        // Search
        document.getElementById('searchInput').addEventListener('input', renderLogs);

        fetchSession();
        fetchEvents();
    </script>
</body>

</html>
