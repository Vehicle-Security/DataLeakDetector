[project]
name = "data-leak-detector"
version = "0.1.0"
description = "Readable three-stage data leak detection pipeline."
requires-python = ">=3.10"
dependencies = [
  "neo4j>=5.28,<6",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9",
]
vision = [
  "opencv-python>=4.10",
  "pillow>=10",
  "pytesseract>=0.3",
  "rapidocr>=3.9",
  "onnxruntime>=1.20",
]
vision-gpu = [
  "opencv-python>=4.10",
  "pillow>=10",
  "rapidocr>=3.9",
  "onnxruntime-gpu[cuda,cudnn]>=1.20,<1.21",
  "paddleocr>=3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "main"

[tool.setuptools.packages.find]
where = ["main"]

[tool.pytest.ini_options]
pythonpath = ["main"]
testpaths = ["tests"]
addopts = "-q"
